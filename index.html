<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チーム分けとかマッチとか決めちゃうよーん</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #f3f6f8;
  color: #17202a;
}

header {
  background: #173f5f;
  color: white;
  padding: 24px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  opacity: .85;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
  border-left: 5px solid #1f9d8b;
  padding-left: 10px;
}

h3 {
  margin-bottom: 10px;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px 14px;
  cursor: pointer;
  font-weight: bold;
  background: #1f9d8b;
  color: white;
}

button:hover {
  opacity: .85;
}

button.secondary {
  background: #607d8b;
}

button.danger {
  background: #d9534f;
}

button.warning {
  background: #e0a800;
}

button.small {
  padding: 5px 9px;
  font-size: 12px;
}

input, select {
  width: 100%;
  padding: 9px;
  border: 1px solid #ccd5db;
  border-radius: 7px;
  background: white;
}

label {
  font-size: 13px;
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
}

.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 12px;
  align-items: end;
}

@media(max-width:700px) {
  .form-grid {
    grid-template-columns: 1fr 1fr;
  }
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  padding: 9px;
  border-bottom: 1px solid #e4e8eb;
  text-align: center;
}

th {
  background: #eef3f5;
}

tr.absent {
  opacity: .45;
}

.badge {
  display: inline-block;
  padding: 4px 9px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.badge.male {
  background: #d9ecff;
  color: #1765a0;
}

.badge.female {
  background: #ffe0ed;
  color: #b12d67;
}

.badge.grade {
  background: #edf0f2;
}

.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

@media(max-width:700px) {
  .controls {
    grid-template-columns: 1fr 1fr;
  }
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}

.ng-section {
  margin-top: 20px;
  padding: 15px;
  background: #f7f9fa;
  border-radius: 10px;
}

.ng-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-bottom: 8px;
}

@media(max-width:600px) {
  .ng-row {
    grid-template-columns: 1fr 1fr;
  }

  .ng-row button {
    grid-column: span 2;
  }
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 15px;
}

.team {
  border: 2px solid #dfe7eb;
  border-radius: 12px;
  padding: 14px;
  background: #fafcfd;
}

.team h3 {
  margin-top: 0;
  color: #173f5f;
}

.player {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #e8edef;
}

.player:last-child {
  border-bottom: 0;
}

.match-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 15px;
}

.match {
  border: 2px solid #dfe7eb;
  border-radius: 12px;
  padding: 15px;
  background: white;
}

.match-title {
  font-weight: bold;
  color: #173f5f;
  margin-bottom: 10px;
}

.match-vs {
  text-align: center;
  font-weight: bold;
  margin: 8px;
  color: #888;
}

.pair {
  background: #f2f7f8;
  padding: 8px;
  border-radius: 7px;
}

.stat-table td:first-child {
  text-align: left;
  font-weight: bold;
}

.notice {
  background: #fff8df;
  border-left: 4px solid #e0a800;
  padding: 12px;
  border-radius: 7px;
  margin-top: 12px;
}

.success {
  background: #e7f7f2;
  border-left: 4px solid #1f9d8b;
  padding: 12px;
  border-radius: 7px;
  margin-top: 12px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 25px;
}

footer {
  text-align: center;
  color: #777;
  padding: 30px;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>🎾 テニスサークル組み合わせメーカー</h1>
  <p>チーム分け・ダブルス・出欠を自動管理</p>
</header>

<div class="container">

<!-- ================= 名簿 ================= -->

<div class="card">
<h2>① 名簿管理</h2>

<div class="form-grid">

<div>
<label>氏名</label>
<input id="nameInput" placeholder="例：山田太郎">
</div>

<div>
<label>学年</label>
<select id="gradeInput">
<option value="1">1回生</option>
<option value="2">2回生</option>
<option value="3">3回生</option>
<option value="4">4回生以上</option>
</select>
</div>

<div>
<label>性別</label>
<select id="genderInput">
<option value="男">男</option>
<option value="女">女</option>
</select>
</div>

<div>
<label>能力</label>
<select id="skillInput">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5" selected>5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
</select>
</div>

</div>

<div class="action-row">
<button onclick="addPlayer()">＋ メンバー追加</button>
<button class="secondary" onclick="exportData()">データ保存</button>
<button class="secondary" onclick="document.getElementById('fileInput').click()">データ復元</button>
<input
  type="file"
  id="fileInput"
  accept=".json"
  style="display:none"
  onchange="importData(event)"
>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>出席</th>
<th>氏名</th>
<th>学年</th>
<th>性別</th>
<th>能力</th>
<th>操作</th>
</tr>
</thead>
<tbody id="memberTable"></tbody>
</table>
</div>

</div>


<!-- ================= チーム分け ================= -->

<div class="card">
<h2>② チーム分け</h2>

<div class="controls">

<div>
<label>チーム数</label>
<input id="teamCount" type="number" min="1" value="4">
</div>

</div>

<div class="ng-section">
<h3>同じチームにならないペア</h3>

<div id="teamNgList"></div>

<button class="secondary small" onclick="addTeamNG()">＋ ペアNGを追加</button>
</div>

<div class="action-row">
<button onclick="makeTeams()">🎲 チーム分け実行</button>
</div>

<div id="teamResult"></div>

</div>


<!-- ================= ダブルス ================= -->

<div class="card">
<h2>③ ダブルス自動作成</h2>

<div class="controls">

<div>
<label>コート数</label>
<input id="courtCount" type="number" min="1" value="2">
</div>

<div>
<label>試合数</label>
<input id="matchCount" type="number" min="1" value="10">
</div>

</div>

<div class="ng-section">

<h3>ダブルス・ペアNG</h3>

<p style="font-size:13px;color:#666;">
同じペアになることだけを禁止します。対戦相手になることは可能です。
</p>

<div id="doubleNgList"></div>

<button class="secondary small" onclick="addDoubleNG()">＋ ペアNGを追加</button>

</div>

<div class="action-row">
<button onclick="makeMatches()">🎾 ダブルスを作成</button>
</div>

<div id="matchResult"></div>

</div>


<!-- ================= 出場回数 ================= -->

<div class="card">
<h2>④ 出場回数</h2>
<div id="statsResult"></div>
</div>

</div>

<footer>
テニスサークル組み合わせメーカー
</footer>


<script>

/* =========================================================
   データ
========================================================= */

let players = [];

let teamNG = [];

let doubleNG = [];

let matches = [];

let teams = [];


/* =========================================================
   初期化
========================================================= */

window.onload = function() {

  loadData();

  renderMembers();

  renderNGLists();

};


/* =========================================================
   保存
========================================================= */

function saveData() {

  const data = {
    players,
    teamNG,
    doubleNG
  };

  localStorage.setItem(
    "tennisCircleData",
    JSON.stringify(data)
  );
}


/* =========================================================
   読み込み
========================================================= */

function loadData() {

  const raw =
    localStorage.getItem("tennisCircleData");

  if (!raw) return;

  try {

    const data = JSON.parse(raw);

    players = data.players || [];

    teamNG = data.teamNG || [];

    doubleNG = data.doubleNG || [];

  } catch(e) {

    console.error(e);

  }
}


/* =========================================================
   メンバー追加
========================================================= */

function addPlayer() {

  const name =
    document.getElementById("nameInput").value.trim();

  if (!name) {

    alert("氏名を入力してください。");

    return;

  }

  const player = {

    id: crypto.randomUUID(),

    name,

    grade:
      Number(document.getElementById("gradeInput").value),

    gender:
      document.getElementById("genderInput").value,

    skill:
      Number(document.getElementById("skillInput").value),

    present: true

  };

  players.push(player);

  document.getElementById("nameInput").value = "";

  saveData();

  renderMembers();

  renderNGLists();

}


/* =========================================================
   メンバー表示
========================================================= */

function renderMembers() {

  const tbody =
    document.getElementById("memberTable");

  if (!players.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          まだメンバーが登録されていません
        </td>
      </tr>
    `;

    return;

  }

  tbody.innerHTML =
    players.map((p, i) => {

      return `

      <tr class="${p.present ? "" : "absent"}">

        <td>
          <input
            type="checkbox"
            ${p.present ? "checked" : ""}
            onchange="toggleAttendance(${i})"
          >
        </td>

        <td>
          <input
            value="${escapeHTML(p.name)}"
            onchange="editName(${i}, this.value)"
          >
        </td>

        <td>

          <select onchange="editGrade(${i}, this.value)">

            <option value="1"
              ${p.grade === 1 ? "selected" : ""}>
              1回生
            </option>

            <option value="2"
              ${p.grade === 2 ? "selected" : ""}>
              2回生
            </option>

            <option value="3"
              ${p.grade === 3 ? "selected" : ""}>
              3回生
            </option>

            <option value="4"
              ${p.grade === 4 ? "selected" : ""}>
              4回生以上
            </option>

          </select>

        </td>

        <td>

          <select onchange="editGender(${i}, this.value)">

            <option
              ${p.gender === "男" ? "selected" : ""}>
              男
            </option>

            <option
              ${p.gender === "女" ? "selected" : ""}>
              女
            </option>

          </select>

        </td>

        <td>

          <select onchange="editSkill(${i}, this.value)">

            ${Array.from({length:10}, (_,n) => {

              const v = n + 1;

              return `
                <option
                  value="${v}"
                  ${p.skill === v ? "selected" : ""}
                >
                  ${v}
                </option>
              `;

            }).join("")}

          </select>

        </td>

        <td>

          <button
            class="danger small"
            onclick="deletePlayer(${i})">
            削除
          </button>

        </td>

      </tr>

      `;

    }).join("");

}


/* =========================================================
   編集
========================================================= */

function editName(i, value) {

  players[i].name = value.trim();

  saveData();

  renderNGLists();

}

function editGrade(i, value) {

  players[i].grade = Number(value);

  saveData();

}

function editGender(i, value) {

  players[i].gender = value;

  saveData();

}

function editSkill(i, value) {

  players[i].skill = Number(value);

  saveData();

}

function toggleAttendance(i) {

  players[i].present =
    !players[i].present;

  saveData();

  renderMembers();

}


/* =========================================================
   削除
========================================================= */

function deletePlayer(i) {

  if (!confirm(
    `${players[i].name}を削除しますか？`
  )) return;

  const id = players[i].id;

  players.splice(i, 1);

  teamNG = teamNG.filter(
    p => p[0] !== id && p[1] !== id
  );

  doubleNG = doubleNG.filter(
    p => p[0] !== id && p[1] !== id
  );

  saveData();

  renderMembers();

  renderNGLists();

}


/* =========================================================
   NG選択肢
========================================================= */

function playerOptions(selected) {

  return players.map(p => {

    return `
      <option
        value="${p.id}"
        ${p.id === selected ? "selected" : ""}
      >
        ${escapeHTML(p.name)}
      </option>
    `;

  }).join("");

}


/* =========================================================
   チームNG
========================================================= */

function addTeamNG() {

  if (players.length < 2) {

    alert("先に2人以上登録してください。");

    return;

  }

  teamNG.push([
    players[0].id,
    players[1].id
  ]);

  saveData();

  renderNGLists();

}


function addDoubleNG() {

  if (players.length < 2) {

    alert("先に2人以上登録してください。");

    return;

  }

  doubleNG.push([
    players[0].id,
    players[1].id
  ]);

  saveData();

  renderNGLists();

}


function renderNGLists() {

  renderNGList(
    "teamNgList",
    teamNG,
    "team"
  );

  renderNGList(
    "doubleNgList",
    doubleNG,
    "double"
  );

}


function renderNGList(containerId, list, type) {

  const container =
    document.getElementById(containerId);

  if (!list.length) {

    container.innerHTML =
      `<p style="color:#888;font-size:13px;">
        設定されているNGはありません
      </p>`;

    return;

  }

  container.innerHTML =
    list.map((pair, index) => {

      return `

      <div class="ng-row">

        <select
          onchange="changeNG('${type}', ${index}, 0, this.value)"
        >
          ${playerOptions(pair[0])}
        </select>

        <select
          onchange="changeNG('${type}', ${index}, 1, this.value)"
        >
          ${playerOptions(pair[1])}
        </select>

        <button
          class="danger small"
          onclick="removeNG('${type}', ${index})">
          削除
        </button>

      </div>

      `;

    }).join("");

}


function changeNG(type, index, position, value) {

  const list =
    type === "team" ? teamNG : doubleNG;

  list[index][position] = value;

  saveData();

}


function removeNG(type, index) {

  if (type === "team") {

    teamNG.splice(index, 1);

  } else {

    doubleNG.splice(index, 1);

  }

  saveData();

  renderNGLists();

}


/* =========================================================
   NG判定
========================================================= */

function isNG(list, a, b) {

  return list.some(pair =>

    (pair[0] === a.id && pair[1] === b.id) ||

    (pair[0] === b.id && pair[1] === a.id)

  );

}


/* =========================================================
   チーム作成
========================================================= */

function makeTeams() {

  const active =
    players.filter(p => p.present);

  const count =
    Number(document.getElementById("teamCount").value);

  if (!active.length) {

    alert("出席者がいません。");

    return;

  }

  if (count < 1) {

    alert("チーム数を確認してください。");

    return;

  }

  if (count > active.length) {

    alert("チーム数が出席人数を超えています。");

    return;

  }

  teams =
    Array.from(
      {length: count},
      () => []
    );

  /*
    完全ランダムではなく、
    能力の高い順に蛇行させることで
    能力差を抑える初期配置を作る。
  */

  const sorted =
    [...active].sort(
      (a,b) => b.skill - a.skill
    );

  sorted.forEach((p, index) => {

    const round =
      Math.floor(index / count);

    const pos =
      index % count;

    const teamIndex =
      round % 2 === 0
      ? pos
      : count - 1 - pos;

    teams[teamIndex].push(p);

  });


  /*
    NG違反やバランスを評価し、
    メンバー交換による改善を繰り返す。
  */

  for (let loop = 0; loop < 5000; loop++) {

    let best = null;

    let bestScore =
      evaluateTeams(teams);

    for (let a = 0; a < count; a++) {

      for (let b = a + 1; b < count; b++) {

        for (
          let ia = 0;
          ia < teams[a].length;
          ia++
        ) {

          for (
            let ib = 0;
            ib < teams[b].length;
            ib++
          ) {

            [
              teams[a][ia],
              teams[b][ib]
            ] =
            [
              teams[b][ib],
              teams[a][ia]
            ];

            const score =
              evaluateTeams(teams);

            if (score < bestScore) {

              bestScore = score;

              best = {
                a,
                b,
                ia,
                ib
              };

            }

            [
              teams[a][ia],
              teams[b][ib]
            ] =
            [
              teams[b][ib],
              teams[a][ia]
            ];

          }

        }

      }

    }

    if (!best) break;

    [
      teams[best.a][best.ia],
      teams[best.b][best.ib]
    ] =
    [
      teams[best.b][best.ib],
      teams[best.a][best.ia]
    ];

  }

  renderTeams();

}


/* =========================================================
   チーム評価
========================================================= */

function evaluateTeams(ts) {

  let score = 0;

  const sizes =
    ts.map(t => t.length);

  const maxSize =
    Math.max(...sizes);

  const minSize =
    Math.min(...sizes);

  /*
    人数差を最優先
  */

  score +=
    (maxSize - minSize) * 100000;


  /*
    チームごとの能力平均
  */

  const skillAvgs =
    ts.map(team =>

      team.length
      ? team.reduce(
          (sum,p) => sum + p.skill,
          0
        ) / team.length
      : 0

    );

  const skillMean =
    skillAvgs.reduce(
      (a,b) => a+b,
      0
    ) / skillAvgs.length;

  skillAvgs.forEach(avg => {

    score +=
      Math.abs(avg - skillMean) * 1000;

  });


  /*
    男女比
  */

  const genderRatios =
    ts.map(team => {

      if (!team.length) return 0;

      const males =
        team.filter(
          p => p.gender === "男"
        ).length;

      return males / team.length;

    });

  const genderMean =
    genderRatios.reduce(
      (a,b) => a+b,
      0
    ) / genderRatios.length;

  genderRatios.forEach(ratio => {

    score +=
      Math.abs(ratio - genderMean) * 500;

  });


  /*
    学年分布
  */

  for (let g = 1; g <= 4; g++) {

    const counts =
      ts.map(team =>
        team.filter(
          p => p.grade === g
        ).length
      );

    const avg =
      counts.reduce(
        (a,b) => a+b,
        0
      ) / counts.length;

    counts.forEach(c => {

      score +=
        Math.abs(c - avg) * 200;

    });

  }


  /*
    チーム内NG
  */

  for (const team of ts) {

    for (let i = 0; i < team.length; i++) {

      for (
        let j = i + 1;
        j < team.length;
        j++
      ) {

        if (
          isNG(
            teamNG,
            team[i],
            team[j]
          )
        ) {

          score += 10000000;

        }

      }

    }

  }

  return score;

}


/* =========================================================
   チーム表示
========================================================= */

function renderTeams() {

  const result =
    document.getElementById("teamResult");

  result.innerHTML = `

    <div class="success">

      チーム分けが完了しました。
      出席者 ${players.filter(p => p.present).length}人

    </div>

    <div class="team-grid" style="margin-top:15px;">

      ${teams.map((team,index) => {

        const avg =
          team.length
          ? (
              team.reduce(
                (sum,p) => sum+p.skill,
                0
              ) / team.length
            ).toFixed(2)
          : "-";

        return `

        <div class="team">

          <h3>チーム ${index+1}</h3>

          <div style="font-size:13px;color:#777;margin-bottom:8px;">
            ${team.length}人　
            平均能力 ${avg}
          </div>

          ${team.map(p => `

            <div class="player">

              <span>
                ${escapeHTML(p.name)}
              </span>

              <span>
                <span class="badge grade">
                  ${gradeText(p.grade)}
                </span>

                <span>
                  ${p.gender}
                </span>

                <strong>
                  ${p.skill}
                </strong>
              </span>

            </div>

          `).join("")}

        </div>

        `;

      }).join("")}

    </div>
  `;

}


/* =========================================================
   ダブルス
========================================================= */

function makeMatches() {

  const active =
    players.filter(p => p.present);

  const courts =
    Number(
      document.getElementById("courtCount").value
    );

  const matchCount =
    Number(
      document.getElementById("matchCount").value
    );

  if (active.length < 4) {

    alert("ダブルスには4人以上の出席者が必要です。");

    return;

  }

  if (courts < 1 || matchCount < 1) {

    alert("コート数と試合数を確認してください。");

    return;

  }


  /*
    出場回数
  */

  const appearance = {};

  active.forEach(p => {

    appearance[p.id] = 0;

  });


  const pairHistory = {};

  const opponentHistory = {};

  const consecutive = {};

  active.forEach(p => {

    pairHistory[p.id] = {};

    opponentHistory[p.id] = {};

    consecutive[p.id] = 0;

  });


  matches = [];


  /*
    各ラウンドについて、
    コート数だけ試合を作る。
  */

  for (
    let round = 0;
    round < matchCount;
    round++
  ) {

    const usedThisRound = new Set();

    const roundMatches = [];


    for (
      let court = 0;
      court < courts;
      court++
    ) {

      const candidates =
        buildCandidates(
          active,
          appearance,
          usedThisRound,
          consecutive,
          pairHistory,
          opponentHistory
        );

      if (!candidates.length) break;


      /*
        候補を評価
      */

      let best = null;

      let bestScore = Infinity;


      /*
        ランダム性を少し入れて、
        毎回同じ組み合わせにならないようにする
      */

      for (
        let trial = 0;
        trial < Math.min(
          2000,
          candidates.length * 10
        );
        trial++
      ) {

        const candidate =
          candidates[
            Math.floor(
              Math.random() *
              candidates.length
            )
          ];

        const score =
          evaluateMatch(
            candidate,
            appearance,
            consecutive,
            pairHistory,
            opponentHistory
          );

        if (score < bestScore) {

          bestScore = score;

          best = candidate;

        }

      }


      if (!best) break;


      /*
        採用
      */

      roundMatches.push(best);

      best.players.forEach(p => {

        usedThisRound.add(p.id);

        appearance[p.id]++;

      });


      registerMatchHistory(
        best,
        pairHistory,
        opponentHistory
      );

    }


    /*
      連続試合数更新
    */

    active.forEach(p => {

      if (usedThisRound.has(p.id)) {

        consecutive[p.id]++;

      } else {

        consecutive[p.id] = 0;

      }

    });


    matches.push(
      ...roundMatches
    );

  }


  renderMatches(
    matches,
    appearance
  );

}


/* =========================================================
   ダブルス候補生成
========================================================= */

function buildCandidates(
  active,
  appearance,
  used,
  consecutive,
  pairHistory,
  opponentHistory
) {

  const candidates = [];


  /*
    男2 / 女2 / 男女 の3パターンを作る
  */

  const groups = {

    MM:
      active.filter(
        p => p.gender === "男" &&
             !used.has(p.id)
      ),

    FF:
      active.filter(
        p => p.gender === "女" &&
             !used.has(p.id)
      ),

    MIX:
      active.filter(
        p => !used.has(p.id)
      )

  };


  /*
    男男 vs 男男
  */

  const mmPairs =
    generatePairs(groups.MM);

  for (const a of mmPairs) {

    for (const b of mmPairs) {

      if (
        overlap(a,b)
      ) continue;

      if (
        !validPair(a) ||
        !validPair(b)
      ) continue;

      candidates.push(
        createCandidate(
          a,
          b,
          "男男 vs 男男"
        )
      );

    }

  }


  /*
    女女 vs 女女
  */

  const ffPairs =
    generatePairs(groups.FF);

  for (const a of ffPairs) {

    for (const b of ffPairs) {

      if (overlap(a,b)) continue;

      if (!validPair(a)) continue;

      if (!validPair(b)) continue;

      candidates.push(
        createCandidate(
          a,
          b,
          "女女 vs 女女"
        )
      );

    }

  }


  /*
    男女 vs 男女
  */

  const male =
    active.filter(
      p =>
        p.gender === "男" &&
        !used.has(p.id)
    );

  const female =
    active.filter(
      p =>
        p.gender === "女" &&
        !used.has(p.id)
    );

  for (const m1 of male) {

    for (const m2 of male) {

      if (m1.id === m2.id) continue;

      for (const f1 of female) {

        for (const f2 of female) {

          if (f1.id === f2.id) continue;

          const pair1 =
            [m1,f1];

          const pair2 =
            [m2,f2];

          if (
            isNG(
              doubleNG,
              m1,
              f1
            ) ||
            isNG(
              doubleNG,
              m2,
              f2
            )
          ) continue;

          candidates.push(
            createCandidate(
              pair1,
              pair2,
              "男女 vs 男女"
            )
          );

          /*
            逆組みも候補
          */

          if (
            !isNG(
              doubleNG,
              m1,
              f2
            ) &&
            !isNG(
              doubleNG,
              m2,
              f1
            )
          ) {

            candidates.push(
              createCandidate(
                [m1,f2],
                [m2,f1],
                "男女 vs 男女"
              )
            );

          }

        }

      }

    }

  }


  /*
    同じ人を使っている候補を除外
  */

  return candidates.filter(c => {

    const ids =
      c.players.map(p => p.id);

    return new Set(ids).size === 4;

  });

}


/* =========================================================
   ペア生成
========================================================= */

function generatePairs(list) {

  const result = [];

  for (let i = 0; i < list.length; i++) {

    for (let j = i + 1; j < list.length; j++) {

      const a = list[i];

      const b = list[j];

      if (
        isNG(
          doubleNG,
          a,
          b
        )
      ) continue;

      result.push([a,b]);

    }

  }

  return result;

}


/* =========================================================
   ペア判定
========================================================= */

function validPair(pair) {

  if (pair.length !== 2) return false;

  return !isNG(
    doubleNG,
    pair[0],
    pair[1]
  );

}


/* =========================================================
   候補作成
========================================================= */

function createCandidate(
  pair1,
  pair2,
  type
) {

  return {

    pair1,
    pair2,

    players: [
      ...pair1,
      ...pair2
    ],

    type

  };

}


/* =========================================================
   試合評価
========================================================= */

function evaluateMatch(
  match,
  appearance,
  consecutive,
  pairHistory,
  opponentHistory
) {

  let score = 0;


  /*
    出場回数を最優先
  */

  const appearances =
    match.players.map(
      p => appearance[p.id]
    );

  const max =
    Math.max(...appearances);

  const min =
    Math.min(...appearances);

  score +=
    (max - min) * 100000;


  /*
    個人の出場回数そのもの
  */

  match.players.forEach(p => {

    score +=
      appearance[p.id] * 10000;

  });


  /*
    連続出場を抑える
  */

  match.players.forEach(p => {

    score +=
      consecutive[p.id] * 5000;

  });


  /*
    チーム戦力差
  */

  const skill1 =
    match.pair1
      .reduce(
        (s,p) => s+p.skill,
        0
      );

  const skill2 =
    match.pair2
      .reduce(
        (s,p) => s+p.skill,
        0
      );

  score +=
    Math.abs(skill1 - skill2) * 200;


  /*
    同じペアを避ける
  */

  const p1a = match.pair1[0].id;

  const p1b = match.pair1[1].id;

  const p2a = match.pair2[0].id;

  const p2b = match.pair2[1].id;


  if (
    pairHistory[p1a]?.[p1b]
  ) {

    score +=
      pairHistory[p1a][p1b] * 3000;

  }

  if (
    pairHistory[p2a]?.[p2b]
  ) {

    score +=
      pairHistory[p2a][p2b] * 3000;

  }


  /*
    同じ対戦を避ける
  */

  const opponents1 =
    opponentHistory[p1a]?.[p2a] || 0;

  const opponents2 =
    opponentHistory[p1b]?.[p2b] || 0;

  score +=
    (opponents1 + opponents2) * 1000;


  return score;

}


/* =========================================================
   履歴登録
========================================================= */

function registerMatchHistory(
  match,
  pairHistory,
  opponentHistory
) {

  const [a,b] =
    match.pair1;

  const [c,d] =
    match.pair2;


  addHistory(
    pairHistory,
    a.id,
    b.id
  );

  addHistory(
    pairHistory,
    c.id,
    d.id
  );


  addHistory(
    opponentHistory,
    a.id,
    c.id
  );

  addHistory(
    opponentHistory,
    a.id,
    d.id
  );

  addHistory(
    opponentHistory,
    b.id,
    c.id
  );

  addHistory(
    opponentHistory,
    b.id,
    d.id
  );

}


function addHistory(
  object,
  a,
  b
) {

  if (!object[a]) {

    object[a] = {};

  }

  if (!object[b]) {

    object[b] = {};

  }

  object[a][b] =
    (object[a][b] || 0) + 1;

  object[b][a] =
    (object[b][a] || 0) + 1;

}


/* =========================================================
   重複判定
========================================================= */

function overlap(a,b) {

  const ids =
    a.map(p => p.id);

  return b.some(
    p => ids.includes(p.id)
  );

}


/* =========================================================
   試合表示
========================================================= */

function renderMatches(
  matchList,
  appearance
) {

  const result =
    document.getElementById("matchResult");

  if (!matchList.length) {

    result.innerHTML = `
      <div class="notice">
        条件を満たす試合を作成できませんでした。
        出席者数、男女比、ペアNGなどを確認してください。
      </div>
    `;

    renderStats(appearance);

    return;

  }


  const courtCount =
    Number(
      document.getElementById("courtCount").value
    );


  /*
    試合番号をラウンド・コートに変換
  */

  result.innerHTML = `

    <div class="success">

      ${matchList.length}試合を作成しました。

    </div>

    <div class="match-grid" style="margin-top:15px;">

      ${matchList.map((m,index) => {

        const round =
          Math.floor(index / courtCount) + 1;

        const court =
          (index % courtCount) + 1;

        const skill1 =
          m.pair1.reduce(
            (s,p) => s+p.skill,
            0
          );

        const skill2 =
          m.pair2.reduce(
            (s,p) => s+p.skill,
            0
          );

        return `

        <div class="match">

          <div class="match-title">

            第${round}ラウンド　
            ${court}コート

          </div>

          <div style="font-size:12px;color:#888;margin-bottom:8px;">
            ${m.type}
          </div>

          <div class="pair">

            ${m.pair1.map(p =>
              escapeHTML(p.name)
            ).join(" ・ ")}

            <span style="float:right;">
              ${skill1}
            </span>

          </div>

          <div class="match-vs">
            VS
          </div>

          <div class="pair">

            ${m.pair2.map(p =>
              escapeHTML(p.name)
            ).join(" ・ ")}

            <span style="float:right;">
              ${skill2}
            </span>

          </div>

        </div>

        `;

      }).join("")}

    </div>
  `;


  renderStats(appearance);

}


/* =========================================================
   出場回数
========================================================= */

function renderStats(appearance) {

  const result =
    document.getElementById("statsResult");

  if (!appearance) {

    result.innerHTML =
      `<div class="empty">
        まだ試合が作成されていません。
      </div>`;

    return;

  }


  const active =
    players
      .filter(p => p.present)
      .sort(
        (a,b) =>
          (appearance[b.id] || 0)
          -
          (appearance[a.id] || 0)
      );


  result.innerHTML = `

    <div class="table-wrap">

    <table class="stat-table">

      <thead>

        <tr>

          <th>氏名</th>
          <th>学年</th>
          <th>能力</th>
          <th>出場回数</th>

        </tr>

      </thead>

      <tbody>

        ${active.map(p => `

          <tr>

            <td>
              ${escapeHTML(p.name)}
            </td>

            <td>
              ${gradeText(p.grade)}
            </td>

            <td>
              ${p.skill}
            </td>

            <td>
              <strong>
                ${appearance[p.id] || 0}
              </strong>
            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>

    </div>
  `;

}


/* =========================================================
   データ書き出し
========================================================= */

function exportData() {

  const data = {

    version: 1,

    players,

    teamNG,

    doubleNG,

    exportedAt:
      new Date().toISOString()

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type: "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "tennis-circle-data.json";

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   データ復元
========================================================= */

function importData(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  const reader =
    new FileReader();


  reader.onload = function(e) {

    try {

      const data =
        JSON.parse(e.target.result);


      if (
        !Array.isArray(data.players)
      ) {

        throw new Error();

      }


      players =
        data.players || [];

      teamNG =
        data.teamNG || [];

      doubleNG =
        data.doubleNG || [];


      saveData();

      renderMembers();

      renderNGLists();


      alert("データを復元しました。");


    } catch(e) {

      alert(
        "データの読み込みに失敗しました。"
      );

    }

  };


  reader.readAsText(file);

}


/* =========================================================
   補助
========================================================= */

function gradeText(grade) {

  return grade === 1
    ? "1回生"
    : grade === 2
    ? "2回生"
    : grade === 3
    ? "3回生"
    : "4回生以上";

}


function escapeHTML(str) {

  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}
