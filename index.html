<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tennis Match Manager</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--text:#18212b;--muted:#6b7580;--line:#dfe4e8;--accent:#1769aa;--soft:#eef5fb;--warn:#fff7e6;--danger:#b53a3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.app{max-width:980px;margin:auto;padding:20px 14px 50px}header{margin-bottom:20px}h1{font-size:25px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:13px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h2{font-size:15px;margin:0}.note,.meta{font-size:11px;color:var(--muted)}label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}textarea,input,select{font:inherit;color:var(--text);border:1px solid #cfd6dc;border-radius:7px;background:#fff}textarea{width:100%;padding:9px;resize:vertical;line-height:1.5}input[type=number]{width:100px;padding:8px}button{font:inherit;font-size:13px;font-weight:600;border:1px solid #cbd3da;background:#fff;color:var(--text);border-radius:7px;padding:8px 12px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.actions,.controls{display:flex;flex-wrap:wrap;gap:7px;align-items:end}.controls{gap:12px}.control{min-width:95px}.people{margin-top:13px;border-top:1px solid #edf0f2}.person{display:grid;grid-template-columns:28px minmax(0,1fr) 58px 74px;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #edf0f2}.person .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gender,.grade{width:100%}.person.absent{opacity:.4}.checkline{display:flex;align-items:center;gap:7px;font-size:12px;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px}.team{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fbfcfd}.team-title{display:flex;justify-content:space-between;margin-bottom:7px}.member{font-size:12px;padding:4px 0;border-top:1px solid #edf0f2;display:flex;justify-content:space-between;gap:6px}.summary{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.pill{font-size:10px;padding:4px 7px;border-radius:99px;background:#eef2f5;color:#4e5964}.alert{margin-top:10px;border-radius:8px;padding:9px 11px;font-size:12px;background:var(--warn);border:1px solid #ead39d}.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px}.round{margin-top:15px}.round:first-child{margin-top:0}.round-title{display:flex;justify-content:space-between;align-items:center;background:#eef2f5;border-radius:7px;padding:8px 10px;font-size:12px;font-weight:700}.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:9px;margin-top:8px}.court{border:1px solid var(--line);border-radius:9px;padding:11px;background:#fff}.court.bad{border-color:#e2b0b0;background:#fffafa}.court-title{font-size:10px;color:var(--muted);margin-bottom:8px;font-weight:700}.teams-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.side{background:#f6f8fa;border-radius:7px;padding:8px}.side div{font-size:13px;font-weight:600;line-height:1.55}.vs{font-size:10px;color:var(--muted);font-weight:700}.tag{display:inline-block;font-size:9px;margin-top:7px;padding:3px 6px;border-radius:99px;background:#edf1f4;color:#5d6770}.table-wrap{overflow-x:auto}.counts{width:100%;border-collapse:collapse;font-size:12px}.counts th,.counts td{padding:7px;border-bottom:1px solid var(--line);text-align:left}.counts th{color:var(--muted);font-weight:500}.save{font-size:11px;color:var(--muted);margin-top:7px}@media(max-width:560px){.app{padding:14px 9px 35px}h1{font-size:22px}.section{padding:13px}.person{grid-template-columns:25px minmax(0,1fr) 50px 68px}.teams-vs{grid-template-columns:1fr}.vs{text-align:center}.courts{grid-template-columns:1fr}}
</style></head><body><div class="app">
<header><h1>Tennis Match Manager</h1><div class="sub">出欠・学年・チーム分け・対戦表をまとめて管理</div></header>
<section class="section"><div class="head"><h2>Players</h2><span class="note">名前は1行につき1人</span></div><textarea id="names" rows="6" placeholder="山田太郎\n田中一郎\n佐藤花子\n鈴木花子"></textarea><div class="actions" style="margin-top:9px"><button class="primary" id="build">出欠欄を作成</button></div><div id="people"></div><div class="save" id="saveStatus"></div></section>
<section class="section"><div class="head"><h2>Team Assignment</h2><span class="note">人数 → 学年 → 男女をなるべく均等に</span></div><div class="controls"><div class="control"><label>チーム数</label><input id="teamCount" type="number" min="1" max="26" value="2"></div><button class="primary" id="teamsBtn">チーム分け</button><button id="shuffleBtn">別の組み合わせ</button></div><label style="margin-top:13px">同じチームNG</label><textarea id="teamNG" rows="3" placeholder="山田太郎,田中一郎"></textarea><div class="note" style="margin-top:5px">指定した2人は同じチームになりません。</div><div id="teams" style="margin-top:13px"></div></section>
<section class="section"><div class="head"><h2>Match Settings</h2><span class="note">ダブルス</span></div><div class="controls"><div class="control"><label>コート数</label><input id="courts" type="number" min="1" value="2"></div><div class="control"><label>試合数</label><input id="matches" type="number" min="1" value="5"></div></div><label style="margin-top:13px">ペアNG</label><textarea id="ng" rows="3" placeholder="山田太郎,田中一郎"></textarea><label class="checkline"><input id="avoid" type="checkbox" checked> 男女の組み合わせ（男女vs男女）を優先</label><div class="actions" style="margin-top:9px"><button class="primary" id="matchBtn">対戦表を作成</button></div><div id="message"></div></section>
<section class="section"><div class="head"><h2>Schedule</h2><span class="note">見やすいラウンド・コート表示</span></div><div id="schedule"><div class="empty">対戦表を作成するとここに表示されます。</div></div></section>
</div>
<script>
const $=id=>document.getElementById(id);let gm={};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const names=()=>[...new Set($("names").value.split(/\n/).map(x=>x.trim()).filter(Boolean))];
const shuffle=a=>{let x=[...a];for(let i=x.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const key=(a,b)=>[a,b].sort().join("|");
function build(){document.querySelectorAll(".gender,.grade").forEach(x=>{if(x.classList.contains('gender'))gm[x.dataset.n]=gm[x.dataset.n]||x.value});let a=names(),old={};document.querySelectorAll('.person').forEach(r=>{let n=r.dataset.n;if(n)old[n]={present:r.querySelector('.att')?.checked!==false,gender:r.querySelector('.gender')?.value||'M',grade:r.querySelector('.grade')?.value||'1'}});let h='<div class="people">';a.forEach(n=>{let o=old[n]||{present:true,gender:gm[n]||'M',grade:'1',};h+=`<div class="person ${o.present?'':'absent'}" data-n="${esc(n)}"><input class="att" type="checkbox" ${o.present?'checked':''}><span class="name">${esc(n)}</span><select class="gender"><option value="M" ${o.gender==='M'?'selected':''}>男</option><option value="F" ${o.gender==='F'?'selected':''}>女</option></select><select class="grade"><option value="1" ${o.grade==='1'?'selected':''}>1年</option><option value="2" ${o.grade==='2'?'selected':''}>2年</option><option value="3" ${o.grade==='3'?'selected':''}>3年</option><option value="4" ${o.grade==='4'?'selected':''}>4回生以上</option></select></div>`});h+='</div><div class="actions"><button id="in">全員出席</button><button id="out">全員欠席</button></div>';$('people').innerHTML=h;document.querySelectorAll('.person').forEach(r=>{let a=r.querySelector('.att');a.onchange=()=>r.classList.toggle('absent',!a.checked)});$('in').onclick=()=>{document.querySelectorAll('.att').forEach(x=>{x.checked=true;x.closest('.person').classList.remove('absent')})};$('out').onclick=()=>{document.querySelectorAll('.att').forEach(x=>{x.checked=false;x.closest('.person').classList.add('absent')})};autoSave()}
function playerData(){let a=[];document.querySelectorAll('.person').forEach(r=>{a.push({name:r.dataset.n,present:r.querySelector('.att').checked,gender:r.querySelector('.gender').value,grade:+r.querySelector('.grade').value,})});return a}
function present(){return playerData().filter(x=>x.present)}
function ngset(text){let s=new Set();text.split(/\n/).forEach(l=>{let a=l.split(/[,、，]/).map(x=>x.trim()).filter(Boolean);if(a.length>=2)s.add(key(a[0],a[1]))});return s}
function teamScore(t,players){let grades=[1,2,3,4].map(g=>t.filter(x=>x.grade===g).length);let gs=grades.reduce((s,x)=>s+x*x,0);let m=t.filter(x=>x.gender==='M').length,f=t.length-m;return Math.abs(m-f)*3+gs*2}
function makeTeams(){let p=present(),n=Math.max(1,Math.min(26,+$('teamCount').value||1)),ng=ngset($('teamNG').value);if(p.length<n){$('teams').innerHTML='<div class="alert">チーム数より出席者数が少ないため作成できません。</div>';return}let best=null,bs=1e99;for(let tr=0;tr<900;tr++){let order=shuffle(p).sort((a,b)=>(b.grade-a.grade)+(Math.random()-.5)*2);let base=Math.floor(p.length/n),extra=p.length%n,sizes=Array(n).fill(base);shuffle([...Array(n).keys()]).slice(0,extra).forEach(i=>sizes[i]++);let ts=Array.from({length:n},(_,i)=>({name:String.fromCharCode(65+i),members:[]}));let ok=true;for(let person of order){let cand=ts.map((t,i)=>({t,i})).filter(o=>o.t.members.length<sizes[o.i]&&!o.t.members.some(q=>ng.has(key(person.name,q.name))));if(!cand.length){ok=false;break}cand.sort((a,b)=>{let sa=teamScore(a.t.members.concat(person),p)+a.t.members.length*2+Math.random()*4;let sb=teamScore(b.t.members.concat(person),p)+b.t.members.length*2+Math.random()*4;return sa-sb});cand[0].t.members.push(person)}if(!ok)continue;let score=ts.reduce((s,t)=>s+teamScore(t.members,p),0);for(let i=0;i<ts.length;i++)for(let j=i+1;j<ts.length;j++){let ai=ts[i].members.map(x=>x.grade),aj=ts[j].members.map(x=>x.grade);score+=Math.abs(ai.filter(x=>x===1).length-aj.filter(x=>x===1).length)*2+Math.abs(ai.filter(x=>x===2).length-aj.filter(x=>x===2).length)*2+Math.abs(ai.filter(x=>x===3).length-aj.filter(x=>x===3).length)*2+Math.abs(ai.filter(x=>x===4).length-aj.filter(x=>x===4).length)*2}if(score<bs){bs=score;best=ts}}if(!best){$('teams').innerHTML='<div class="alert">NG条件が厳しすぎてチーム分けできませんでした。</div>';return}let h='<div class="grid">';best.forEach(t=>{let m=t.members.filter(x=>x.gender==='M').length,f=t.members.length-m;h+=`<div class="team"><div class="team-title"><strong>${t.name} TEAM</strong><span class="meta">${t.members.length}人</span></div>`;t.members.sort((a,b)=>a.grade-b.grade||a.name.localeCompare(b.name,'ja')).forEach(x=>h+=`<div class="member"><span>${esc(x.name)}</span><span class="meta">${x.grade}年 / ${x.gender==='M'?'男':'女'}</span></div>`);h+=`<div class="summary"><span class="pill">男 ${m}</span><span class="pill">女 ${f}</span><span class="pill">1年 ${t.members.filter(x=>x.grade===1).length}</span><span class="pill">2年 ${t.members.filter(x=>x.grade===2).length}</span><span class="pill">3年 ${t.members.filter(x=>x.grade===3).length}</span><span class="pill">4回生以上 ${t.members.filter(x=>x.grade===4).length}</span></div></div>`});$('teams').innerHTML=h+'</div>';autoSave()}
function type(pair){let m=pair.filter(x=>x.gender==='M').length;return m===2?'MM':m===0?'FF':'MF'}
function legalTypes(a,b){let x=type(a),y=type(b);return (x==='MM'&&y==='MM')||(x==='FF'&&y==='FF')||(x==='MF'&&y==='MF')}
function chooseRound(p,c,counts,pairHist,opHist,ng,avoid,prev2,prev1,target){let best=null,bs=1e99;for(let q=0;q<900;q++){let available=shuffle(p).sort((a,b)=>counts[a.name]-counts[b.name]+(Math.random()-.5)*1.5);let used=new Set(),courts=[],score=0,ok=true;for(let ci=0;ci<c;ci++){let cand=available.filter(x=>!used.has(x.name)&&(!target||counts[x.name]<target[x.name]));if(cand.length<4){ok=false;break}let chosen=null,cs=1e99;for(let z=0;z<180;z++){let four=shuffle(cand).slice(0,4),pairings=[[[four[0],four[1]],[four[2],four[3]]],[[four[0],four[2]],[four[1],four[3]]],[[four[0],four[3]],[four[1],four[2]]]];for(let pp of pairings){let[a,b]=pp;if(ng.has(key(a[0].name,a[1].name))||ng.has(key(b[0].name,b[1].name)))continue;let sc=0;if(!legalTypes(a,b))sc+=1e7;sc+=(pairHist.get(key(a[0].name,a[1].name))||0)*250+(pairHist.get(key(b[0].name,b[1].name))||0)*250;for(let x of a)for(let y of b)sc+=(opHist.has(key(x.name,y.name))?12:0);for(let x of four){if(prev2.has(x.name)&&prev1.has(x.name))sc+=4500;if(!prev2.has(x.name)&&!prev1.has(x.name))sc+=1700;if(target)sc+=Math.abs((counts[x.name]+1)-target[x.name])*5000}if(avoid&&((type(a)==='MM'&&type(b)==='FF')||(type(a)==='FF'&&type(b)==='MM')))sc+=1e7;if(sc<cs){cs=sc;chosen={a,b,four}}}}if(!chosen){ok=false;break}chosen.four.forEach(x=>used.add(x.name));courts.push(chosen);score+=cs}if(ok&&score<bs){bs=score;best=courts}}return best}

function matches(){let p=present(),c=Math.max(1,+$('courts').value||1),r=Math.max(1,+$('matches').value||1),ng=ngset($('ng').value),avoid=$('avoid').checked;if(p.length<4){$('message').innerHTML='<div class="alert">ダブルスには4人以上必要です。</div>';return}if(p.length<c*4){$('message').innerHTML=`<div class="alert">${c}コートでは1ラウンド${c*4}人必要です。</div>`;return}let counts={},pairHist=new Map(),opHist=new Set(),rounds=[],prev2=new Set(),prev1=new Set();p.forEach(x=>counts[x.name]=0);let slots=r*c*4,base=Math.floor(slots/p.length),extra=slots%p.length;let target={};p.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach((x,i)=>target[x.name]=base+(i<extra?1:0));for(let rd=1;rd<=r;rd++){let q=chooseRound(p,c,counts,pairHist,opHist,ng,avoid,prev2,prev1,target);if(!q)break;let now=new Set();q.forEach(co=>{co.four.forEach(x=>{counts[x.name]++;now.add(x.name)});[co.a,co.b].forEach(t=>pairHist.set(key(t[0].name,t[1].name),(pairHist.get(key(t[0].name,t[1].name))||0)+1));for(let x of co.a)for(let y of co.b)opHist.add(key(x.name,y.name))});rounds.push({round:rd,courts:q});prev2=new Set(prev1);prev1=now}let h='';rounds.forEach(rd=>{h+=`<div class="round"><div class="round-title"><span>第${rd.round}ラウンド</span><span>${rd.courts.length}コート</span></div><div class="courts">`;rd.courts.forEach((co,i)=>{let label=type(co.a);h+=`<div class="court"><div class="court-title">COURT ${i+1}</div><div class="teams-vs"><div class="side"><div>${esc(co.a[0].name)}</div><div>${esc(co.a[1].name)}</div></div><div class="vs">VS</div><div class="side"><div>${esc(co.b[0].name)}</div><div>${esc(co.b[1].name)}</div></div></div><span class="tag">${label==='MM'?'男男':label==='FF'?'女女':'男女'} vs ${label==='MM'?'男男':label==='FF'?'女女':'男女'}</span></div>`});h+='</div></div>'});let vals=Object.values(counts),min=Math.min(...vals),max=Math.max(...vals);let table='<div class="summary"><span class="pill">'+p.length+'人</span><span class="pill">'+rounds.length+'ラウンド</span><span class="pill">出場回数 '+min+'〜'+max+'回</span></div><div class="table-wrap" style="margin-top:10px"><table class="counts"><tr><th>名前</th><th>学年</th><th>出場</th></tr>';p.sort((a,b)=>counts[b.name]-counts[a.name]).forEach(x=>table+=`<tr><td>${esc(x.name)}</td><td>${x.grade===4?'4回生以上':x.grade+'回生'}</td><td>${counts[x.name]}回</td></tr>`);table+='</table></div>';if(rounds.length<r){$('message').innerHTML='<div class="alert">出場回数を均等にする条件では、この条件の組み合わせを最後まで作れませんでした。コート数・試合数・NG条件を少し減らすと作りやすくなります。</div>';}else{$('message').innerHTML='<div class="ok">出場回数は '+min+'〜'+max+'回に均等化されています。</div>';}$('schedule').innerHTML=table+h;autoSave()}
const STORAGE='tennis_match_manager_v4';
function state(){return{names:$('names').value,gm,players:playerData(),teamCount:$('teamCount').value,teamNG:$('teamNG').value,courts:$('courts').value,matches:$('matches').value,ng:$('ng').value,avoid:$('avoid').checked}}
let timer;function autoSave(){clearTimeout(timer);timer=setTimeout(()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state()));$('saveStatus').textContent='自動保存済み';}catch(e){}},300)}
function load(){try{let s=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!s)return;$('names').value=s.names||'';gm=s.gm||{};$('teamCount').value=s.teamCount||2;$('teamNG').value=s.teamNG||'';$('courts').value=s.courts||2;$('matches').value=s.matches||5;$('ng').value=s.ng||'';$('avoid').checked=s.avoid!==false;build();if(s.players?.length){document.querySelectorAll('.person').forEach(r=>{let x=s.players.find(q=>q.name===r.dataset.n);if(!x)return;r.querySelector('.att').checked=x.present;r.querySelector('.gender').value=x.gender;r.querySelector('.grade').value=x.grade;r.classList.toggle('absent',!x.present)})}$('saveStatus').textContent='前回のデータを復元しました';}catch(e){}}
$('build').onclick=build;$('teamsBtn').onclick=makeTeams;$('shuffleBtn').onclick=makeTeams;$('matchBtn').onclick=matches;document.addEventListener('input',e=>{if(e.target.matches('input,textarea,select'))autoSave()});document.addEventListener('change',e=>{if(e.target.matches('input,textarea,select'))autoSave()});window.addEventListener('DOMContentLoaded',load);
</script></body></html>
