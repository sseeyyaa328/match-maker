<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tennis Match Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

:root{
  --bg:#f4f6f8;
  --panel:#fff;
  --text:#17202a;
  --muted:#6b7280;
  --line:#e5e7eb;
  --accent:#1769aa;
  --accent-dark:#0f4f82;
  --soft:#eef5fb;
  --danger:#c0392b;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,"Noto Sans JP",sans-serif;
  line-height:1.5;
}

.container{
  width:min(900px,calc(100% - 24px));
  margin:24px auto 50px;
}

header{margin-bottom:20px}

h1{
  margin:0;
  font-size:26px;
}

header p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.025);
}

.card-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:13px;
}

textarea,input,select{
  font:inherit;
}

textarea{
  width:100%;
  min-height:130px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  resize:vertical;
  outline:none;
  background:#fff;
}

textarea:focus,input:focus,select:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(23,105,170,.1);
}

input[type="number"]{
  width:100%;
  height:40px;
  border:1px solid var(--line);
  border-radius:7px;
  padding:0 10px;
}

button{
  border:0;
  border-radius:7px;
  padding:9px 14px;
  font:inherit;
  font-weight:600;
  cursor:pointer;
}

.btn-primary{
  background:var(--accent);
  color:white;
}

.btn-primary:hover{
  background:var(--accent-dark);
}

.btn-secondary{
  background:#edf1f4;
  color:#26323d;
}

.btn-danger{
  background:#fff0ee;
  color:var(--danger);
}

.btn-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.save-status{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}

.settings{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.field label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin-bottom:5px;
  font-weight:600;
}

.person{
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px 0;
  border-bottom:1px solid #edf0f2;
}

.person-name{
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.attend{
  width:20px;
  height:20px;
  flex:0 0 20px;
  accent-color:var(--accent);
}

.gender{
  width:68px;
  height:34px;
  flex:0 0 68px;
  border:1px solid var(--line);
  border-radius:7px;
  background:white;
}

.absent{
  opacity:.45;
}

.team-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
  margin-top:12px;
}

.team{
  border:1px solid var(--line);
  border-radius:9px;
  overflow:hidden;
}

.team-head{
  background:#f5f7f9;
  padding:9px 11px;
  display:flex;
  justify-content:space-between;
  font-weight:700;
}

.team-body{
  padding:8px 11px 10px;
}

.team-member{
  font-size:13px;
  padding:3px 0;
}

.team-meta{
  color:var(--muted);
  font-size:11px;
}

.match-grid{
  display:grid;
  gap:9px;
}

.match{
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
}

.match-head{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-bottom:9px;
}

.court{
  color:var(--accent);
  font-weight:700;
}

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
}

.side{
  background:#f6f8fa;
  border-radius:8px;
  padding:9px;
}

.side-title{
  color:var(--muted);
  font-size:11px;
  margin-bottom:3px;
}

.side-player{
  font-size:14px;
  font-weight:600;
}

.vs{
  color:var(--muted);
  font-size:11px;
  font-weight:700;
}

.appearance-table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

.appearance-table th,
.appearance-table td{
  padding:7px 5px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.appearance-table th{
  color:var(--muted);
  font-size:11px;
}

.empty{
  color:var(--muted);
  font-size:13px;
  padding:8px 0;
}

.note{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}

@media(max-width:560px){

  .container{
    width:calc(100% - 14px);
    margin-top:14px;
  }

  .card{
    padding:14px;
  }

  h1{
    font-size:22px;
  }

  .settings{
    grid-template-columns:1fr 1fr;
  }

  .settings .field:last-child{
    grid-column:span 2;
  }

  .gender{
    width:64px;
    flex-basis:64px;
  }

  .match-teams{
    grid-template-columns:1fr;
  }

  .vs{
    text-align:center;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Tennis Match Manager</h1>
  <p>ダブルスの組み合わせ・チーム分け・出場回数をまとめて管理</p>
</header>


<!-- 保存 -->
<section class="card">

  <div class="card-title">データ保存</div>

  <div class="btn-row">

    <button class="btn-primary" onclick="saveData()">
      保存
    </button>

    <button class="btn-secondary" onclick="loadData()">
      復元
    </button>

    <button class="btn-danger" onclick="deleteSavedData()">
      保存データを削除
    </button>

  </div>

  <div id="saveStatus" class="save-status">
    自動保存：待機中
  </div>

</section>


<!-- 参加者 -->
<section class="card">

  <div class="card-title">参加者</div>

  <textarea id="names"
    placeholder="名前を1行ずつ入力してください
例：
田中
山田
佐藤
鈴木"></textarea>

  <div class="btn-row">

    <button class="btn-primary"
      onclick="createPeople()">
      出欠欄を作成
    </button>

  </div>

  <div id="people"></div>

</section>


<!-- チーム -->
<section class="card">

  <div class="card-title">チーム分け</div>

  <div class="settings">

    <div class="field">

      <label>チーム数</label>

      <input
        id="teamCount"
        type="number"
        min="1"
        value="4">

    </div>

  </div>


  <div style="margin-top:12px">

    <label
      style="font-size:12px;color:var(--muted);font-weight:600">

      同じチームNG

    </label>

    <textarea
      id="teamNG"
      style="min-height:80px;margin-top:5px"
      placeholder="同じチームにしたくない組み合わせ
例：
田中,山田
佐藤,鈴木"></textarea>

    <div class="note">
      ※指定した2人は同じチームになりません。
    </div>

  </div>


  <div class="btn-row">

    <button
      class="btn-primary"
      onclick="makeTeams()">

      チームを作成

    </button>

    <button
      class="btn-secondary"
      onclick="makeTeams()">

      再シャッフル

    </button>

  </div>

  <div id="teams" class="team-grid"></div>

</section>


<!-- 試合設定 -->
<section class="card">

  <div class="card-title">試合設定</div>

  <div class="settings">

    <div class="field">

      <label>コート数</label>

      <input
        id="courtCount"
        type="number"
        min="1"
        value="2">

    </div>

    <div class="field">

      <label>試合数</label>

      <input
        id="matchCount"
        type="number"
        min="1"
        value="10">

    </div>

  </div>


  <div style="margin-top:13px">

    <label
      style="font-size:12px;color:var(--muted);font-weight:600">

      ペアNG

    </label>

    <textarea
      id="pairNG"
      style="min-height:80px;margin-top:5px"
      placeholder="同じペアにしたくない組み合わせ
例：
田中,山田
佐藤,鈴木"></textarea>

  </div>


  <div style="margin-top:10px">

    <label
      style="display:flex;align-items:center;gap:7px;font-size:13px">

      <input
        id="avoidMMFF"
        type="checkbox"
        checked>

      男男 vs 女女をできるだけ避ける

    </label>

  </div>


  <div class="btn-row">

    <button
      class="btn-primary"
      onclick="generateMatches()">

      試合を作成

    </button>

  </div>

</section>


<!-- 試合 -->
<section class="card">

  <div class="card-title">
    試合一覧
  </div>

  <div id="matches" class="match-grid">

    <div class="empty">
      まだ試合が作成されていません。
    </div>

  </div>

</section>


<!-- 出場回数 -->
<section class="card">

  <div class="card-title">
    出場回数
  </div>

  <div id="appearance">

    <div class="empty">
      試合を作成すると表示されます。
    </div>

  </div>

</section>

</div>


<script>

let people=[];
let teams=[];
let matches=[];


/* =========================
   共通
========================= */

const $=id=>document.getElementById(id);


function shuffle(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}


function escapeHtml(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function pairKey(a,b){

  return [a,b].sort().join("|||");

}


function parseNG(text){

  const set=new Set();

  text
    .split(/\n/)
    .map(x=>x.trim())
    .filter(Boolean)
    .forEach(line=>{

      const p=line
        .split(/[,\t、 ]+/)
        .map(x=>x.trim())
        .filter(Boolean);

      if(p.length>=2){

        set.add(
          pairKey(p[0],p[1])
        );

      }

    });

  return set;

}


/* =========================
   保存機能
========================= */

const STORAGE_KEY=
  "tennis_match_manager_data_v3";


function collectData(){

  return {

    names:$("names").value,

    people:people,

    teamCount:$("teamCount").value,

    teamNG:$("teamNG").value,

    courtCount:$("courtCount").value,

    matchCount:$("matchCount").value,

    pairNG:$("pairNG").value,

    avoidMMFF:$("avoidMMFF").checked,

    teams:teams,

    matches:matches

  };

}


function saveData(showMessage=true){

  try{

    const data=collectData();

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

    if(showMessage){

      $("saveStatus").textContent=
        "保存しました ✓";

    }

  }catch(e){

    $("saveStatus").textContent=
      "保存できませんでした";

  }

}


function loadData(){

  try{

    const raw=
      localStorage.getItem(
        STORAGE_KEY
      );


    if(!raw){

      alert(
        "保存されたデータがありません。"
      );

      return;

    }


    const data=
      JSON.parse(raw);


    $("names").value=
      data.names||"";


    people=
      Array.isArray(data.people)
        ? data.people
        : [];


    $("teamCount").value=
      data.teamCount||4;


    $("teamNG").value=
      data.teamNG||"";


    $("courtCount").value=
      data.courtCount||2;


    $("matchCount").value=
      data.matchCount||10;


    $("pairNG").value=
      data.pairNG||"";


    $("avoidMMFF").checked=
      data.avoidMMFF!==false;


    teams=
      Array.isArray(data.teams)
        ? data.teams
        : [];


    matches=
      Array.isArray(data.matches)
        ? data.matches
        : [];


    renderPeople();

    renderTeams();

    renderMatches();


    if(people.length){

      /*
        保存されている試合から
        出場回数を再計算
      */

      const counts={};

      people.forEach(p=>{
        counts[p.id]=0;
      });


      matches.forEach(m=>{

        [
          ...m.a,
          ...m.b
        ].forEach(p=>{

          if(counts[p.id]!==undefined){

            counts[p.id]++;

          }

        });

      });


      if(matches.length){

        renderAppearances(
          counts
        );

      }

    }


    $("saveStatus").textContent=
      "保存データを復元しました ✓";


  }catch(e){

    alert(
      "保存データの読み込みに失敗しました。"
    );

  }

}


function deleteSavedData(){

  const ok=
    confirm(
      "保存されているデータを削除しますか？"
    );


  if(!ok)return;


  localStorage.removeItem(
    STORAGE_KEY
  );


  $("saveStatus").textContent=
    "保存データを削除しました";


}


/*
  入力変更時に自動保存
*/

let saveTimer=null;


function autoSave(){

  clearTimeout(saveTimer);


  saveTimer=setTimeout(()=>{

    saveData(false);

    $("saveStatus").textContent=
      "自動保存済み ✓";

  },400);

}


document.addEventListener(
  "input",
  e=>{

    if(
      e.target.matches(
        "input,textarea,select"
      )
    ){

      autoSave();

    }

  }
);


document.addEventListener(
  "change",
  e=>{

    if(
      e.target.matches(
        "input,textarea,select"
      )
    ){

      autoSave();

    }

  }
);


/* =========================
   参加者
========================= */

function createPeople(){

  const names=
    $("names").value
      .split(/\n/)
      .map(x=>x.trim())
      .filter(Boolean);


  people=
    names.map((name,id)=>({

      id,

      name,

      present:true,

      gender:""

    }));


  renderPeople();

  autoSave();

}


function renderPeople(){

  const box=$("people");

  box.innerHTML="";


  if(!people.length){

    box.innerHTML=
      `<div class="empty">
        名前を入力してください。
      </div>`;

    return;

  }


  const buttons=
    document.createElement("div");


  buttons.className=
    "btn-row";


  buttons.innerHTML=`

    <button
      class="btn-secondary"
      onclick="setAttendance(true)">
      全員出席
    </button>

    <button
      class="btn-secondary"
      onclick="setAttendance(false)">
      全員欠席
    </button>

  `;


  box.appendChild(buttons);


  people.forEach(p=>{

    const row=
      document.createElement("div");


    row.className=
      "person"+
      (p.present?"":" absent");


    row.innerHTML=`

      <input
        class="attend"
        type="checkbox"
        ${p.present?"checked":""}>

      <div class="person-name">
        ${escapeHtml(p.name)}
      </div>

      <select class="gender">

        <option value="">
          性別
        </option>

        <option value="M"
          ${p.gender==="M"?"selected":""}>
          男性
        </option>

        <option value="F"
          ${p.gender==="F"?"selected":""}>
          女性
        </option>

      </select>

    `;


    const check=
      row.querySelector(".attend");


    const gender=
      row.querySelector(".gender");


    check.onchange=()=>{

      p.present=
        check.checked;


      row.classList.toggle(
        "absent",
        !p.present
      );


      autoSave();

    };


    gender.onchange=()=>{

      p.gender=
        gender.value;


      autoSave();

    };


    box.appendChild(row);

  });

}


function setAttendance(value){

  people.forEach(
    p=>p.present=value
  );

  renderPeople();

  autoSave();

}


function presentPeople(){

  return people.filter(
    p=>p.present
  );

}


/* =========================
   チーム分け
========================= */

function makeTeams(){

  const p=
    presentPeople();


  const n=
    Math.max(
      1,
      parseInt(
        $("teamCount").value
      )||1
    );


  if(p.length<n){

    alert(
      "出席者数よりチーム数を多くすることはできません。"
    );

    return;

  }


  const ng=
    parseNG(
      $("teamNG").value
    );


  /*
    人数を先に完全固定。

    39人 / 4チーム
    → 10 / 10 / 10 / 9
  */

  const base=
    Math.floor(p.length/n);


  const extra=
    p.length%n;


  let sizes=
    Array(n).fill(base);


  shuffle(
    Array.from(
      {length:n},
      (_,i)=>i
    )
  )
  .slice(0,extra)
  .forEach(i=>{
    sizes[i]++;
  });


  let best=null;

  let bestScore=Infinity;


  for(
    let trial=0;
    trial<1500;
    trial++
  ){

    const temp=
      sizes.map(size=>({

        size,

        members:[],

        m:0,

        f:0

      }));


    const order=
      shuffle(p);


    /*
      NG相手が多い人を先に配置
    */

    order.sort((a,b)=>{

      const da=
        p.filter(x=>
          x.id!==a.id &&
          ng.has(
            pairKey(
              a.name,
              x.name
            )
          )
        ).length;


      const db=
        p.filter(x=>
          x.id!==b.id &&
          ng.has(
            pairKey(
              b.name,
              x.name
            )
          )
        ).length;


      return db-da;

    });


    let failed=false;


    for(const person of order){

      const candidates=[];


      temp.forEach(
        (team,index)=>{

          if(
            team.members.length>=
            team.size
          ){
            return;
          }


          const conflict=
            team.members.some(
              other=>
                ng.has(
                  pairKey(
                    person.name,
                    other.name
                  )
                )
            );


          if(conflict)return;


          const nextM=
            team.m+
            (person.gender==="M"?1:0);


          const nextF=
            team.f+
            (person.gender==="F"?1:0);


          candidates.push({

            index,

            score:
              Math.abs(
                nextM-nextF
              )*20+
              Math.random()*10

          });

        }
      );


      if(!candidates.length){

        failed=true;

        break;

      }


      candidates.sort(
        (a,b)=>
          a.score-b.score
      );


      const selected=
        candidates[0];


      const team=
        temp[selected.index];


      team.members.push(person);


      if(person.gender==="M")
        team.m++;


      if(person.gender==="F")
        team.f++;

    }


    if(failed)continue;


    let score=0;


    temp.forEach(team=>{

      score+=
        Math.abs(
          team.m-team.f
        )*10;


      for(
        let i=0;
        i<team.members.length;
        i++
      ){

        for(
          let j=i+1;
          j<team.members.length;
          j++
        ){

          if(
            ng.has(
              pairKey(
                team.members[i].name,
                team.members[j].name
              )
            )
          ){

            score+=100000;

          }

        }

      }

    });


    score+=Math.random();


    if(score<bestScore){

      bestScore=score;

      best=
        temp.map(t=>({

          members:[...t.members],

          m:t.m,

          f:t.f

        }));

    }

  }


  if(!best){

    alert(
      "指定したNG条件ではチーム分けできませんでした。\n\n"+
      "NGを減らすか、チーム数を変更してください。"
    );

    return;

  }


  teams=
    best.map((team,index)=>({

      name:
        String.fromCharCode(
          65+index
        ),

      members:
        team.members,

      m:team.m,

      f:team.f

    }));


  renderTeams();

  autoSave();

}


function renderTeams(){

  const box=$("teams");

  box.innerHTML="";


  teams.forEach(team=>{

    const div=
      document.createElement("div");


    div.className="team";


    div.innerHTML=`

      <div class="team-head">

        <span>
          ${team.name}チーム
        </span>

        <span class="team-meta">
          ${team.members.length}人
        </span>

      </div>


      <div class="team-body">

        <div
          class="team-meta"
          style="margin-bottom:5px">

          男性 ${team.m}
          /
          女性 ${team.f}

        </div>


        ${team.members.map(p=>`

          <div class="team-member">
            ${escapeHtml(p.name)}
          </div>

        `).join("")}

      </div>

    `;


    box.appendChild(div);

  });

}


/* =========================
   試合
========================= */

function generateMatches(){

  const p=
    presentPeople();


  const courts=
    Math.max(
      1,
      parseInt(
        $("courtCount").value
      )||1
    );


  const rounds=
    Math.max(
      1,
      parseInt(
        $("matchCount").value
      )||1
    );


  if(p.length<4){

    alert(
      "ダブルスには最低4人必要です。"
    );

    return;

  }


  if(p.length<courts*4){

    alert(
      `出席者は${p.length}人です。\n`+
      `${courts}コート同時進行には`+
      `${courts*4}人必要です。`
    );

    return;

  }


  const pairNG=
    parseNG(
      $("pairNG").value
    );


  const avoidMMFF=
    $("avoidMMFF").checked;


  let best=null;

  let bestScore=Infinity;


  /*
    500通り作って、
    出場回数が最も均等なものを採用
  */

  for(
    let attempt=0;
    attempt<500;
    attempt++
  ){

    const result=
      buildSchedule(
        p,
        courts,
        rounds,
        pairNG,
        avoidMMFF
      );


    if(!result)continue;


    const counts=
      Object.values(
        result.counts
      );


    const max=
      Math.max(...counts);


    const min=
      Math.min(...counts);


    let score=
      (max-min)*10000;


    const avg=
      counts.reduce(
        (a,b)=>a+b,
        0
      )/counts.length;


    counts.forEach(c=>{

      score+=
        Math.abs(c-avg)*20;

    });


    score+=
      result.repeatPairs*30;


    score+=
      Math.random()*10;


    if(score<bestScore){

      bestScore=score;

      best=result;

    }

  }


  if(!best){

    alert(
      "条件を満たす試合を作成できませんでした。"
    );

    return;

  }


  matches=
    best.matches;


  renderMatches();

  renderAppearances(
    best.counts
  );


  autoSave();

}


/* =========================
   試合スケジュール
========================= */

function buildSchedule(
  players,
  courts,
  rounds,
  pairNG,
  avoidMMFF
){

  const counts={};


  players.forEach(p=>{
    counts[p.id]=0;
  });


  const pairHistory=
    new Map();


  const result=[];


  for(
    let round=1;
    round<=rounds;
    round++
  ){

    let pool=
      shuffle(players)
      .sort((a,b)=>{

        return (
          counts[a.id]-
          counts[b.id]
        )+
        (Math.random()-.5)*.8;

      });


    const used=
      new Set();


    for(
      let court=1;
      court<=courts;
      court++
    ){

      let bestGroup=null;

      let bestScore=Infinity;


      for(
        let trial=0;
        trial<250;
        trial++
      ){

        const candidates=
          shuffle(pool)
          .filter(
            p=>!used.has(p.id)
          );


        if(candidates.length<4)
          continue;


        const group=
          candidates.slice(0,4);


        let baseScore=0;


        group.forEach(p=>{

          baseScore+=
            counts[p.id]*20;

        });


        const pairings=[

          [
            [group[0],group[1]],
            [group[2],group[3]]
          ],

          [
            [group[0],group[2]],
            [group[1],group[3]]
          ],

          [
            [group[0],group[3]],
            [group[1],group[2]]
          ]

        ];


        for(
          const pairing of pairings
        ){

          const a=
            pairing[0];

          const b=
            pairing[1];


          if(
            pairNG.has(
              pairKey(
                a[0].name,
                a[1].name
              )
            )
          )continue;


          if(
            pairNG.has(
              pairKey(
                b[0].name,
                b[1].name
              )
            )
          )continue;


          const keyA=
            pairKey(
              a[0].name,
              a[1].name
            );


          const keyB=
            pairKey(
              b[0].name,
              b[1].name
            );


          let score=
            baseScore;


          score+=
            (pairHistory.get(keyA)||0)
            *100;


          score+=
            (pairHistory.get(keyB)||0)
            *100;


          if(avoidMMFF){

            const aa=
              a.every(
                p=>p.gender==="M"
              );

            const af=
              a.every(
                p=>p.gender==="F"
              );

            const ba=
              b.every(
                p=>p.gender==="M"
              );

            const bf=
              b.every(
                p=>p.gender==="F"
              );


            if(
              (aa&&bf)||
              (af&&ba)
            ){

              score+=500;

            }

          }


          score+=
            Math.random()*20;


          if(score<bestScore){

            bestScore=score;

            bestGroup={

              players:group,

              a,

              b

            };

          }

        }

      }


      if(!bestGroup)
        return null;


      /*
        重要：
        このroundで使った人を
        usedに入れる。

        → 同時進行の別コートには
        同じ人が絶対に入らない。
      */

      bestGroup.players.forEach(p=>{

        used.add(p.id);

        counts[p.id]++;

      });


      const keyA=
        pairKey(
          bestGroup.a[0].name,
          bestGroup.a[1].name
        );


      const keyB=
        pairKey(
          bestGroup.b[0].name,
          bestGroup.b[1].name
        );


      pairHistory.set(
        keyA,
        (pairHistory.get(keyA)||0)+1
      );


      pairHistory.set(
        keyB,
        (pairHistory.get(keyB)||0)+1
      );


      result.push({

        round,

        court,

        a:bestGroup.a,

        b:bestGroup.b

      });

    }

  }


  let repeatPairs=0;


  pairHistory.forEach(v=>{

    if(v>1)
      repeatPairs+=v-1;

  });


  return{

    matches:result,

    counts,

    repeatPairs

  };

}


/* =========================
   試合表示
========================= */

function renderMatches(){

  const box=$("matches");

  box.innerHTML="";


  if(!matches.length){

    box.innerHTML=
      `<div class="empty">
        まだ試合が作成されていません。
      </div>`;

    return;

  }


  matches.forEach(m=>{

    const div=
      document.createElement("div");


    div.className="match";


    div.innerHTML=`

      <div class="match-head">

        <span>
          第${m.round}試合
        </span>

        <span class="court">
          Court ${m.court}
        </span>

      </div>


      <div class="match-teams">

        <div class="side">

          <div class="side-title">
            TEAM A
          </div>

          <div class="side-player">
            ${escapeHtml(m.a[0].name)}
          </div>

          <div class="side-player">
            ${escapeHtml(m.a[1].name)}
          </div>

        </div>


        <div class="vs">
          VS
        </div>


        <div class="side">

          <div class="side-title">
            TEAM B
          </div>

          <div class="side-player">
            ${escapeHtml(m.b[0].name)}
          </div>

          <div class="side-player">
            ${escapeHtml(m.b[1].name)}
          </div>

        </div>

      </div>

    `;


    box.appendChild(div);

  });

}


/* =========================
   出場回数
========================= */

function renderAppearances(counts){

  const box=$("appearance");


  const list=
    presentPeople()
      .map(p=>({

        person:p,

        count:
          counts[p.id]||0

      }))
      .sort((a,b)=>{

        if(
          a.count!==b.count
        ){

          return (
            a.count-b.count
          );

        }

        return a.person.name
          .localeCompare(
            b.person.name,
            "ja"
          );

      });


  if(!list.length){

    box.innerHTML=
      `<div class="empty">
        出席者がいません。
      </div>`;

    return;

  }


  const values=
    list.map(x=>x.count);


  const min=
    Math.min(...values);


  const max=
    Math.max(...values);


  box.innerHTML=`

    <div
      class="note"
      style="margin-bottom:10px">

      出場回数：
      最少 ${min}回 ／
      最多 ${max}回

      ${
        max-min<=1
        ? " → ほぼ均等です。"
        : ""
      }

    </div>


    <table class="appearance-table">

      <thead>

        <tr>

          <th>名前</th>

          <th>出場回数</th>

        </tr>

      </thead>


      <tbody>

        ${list.map(x=>`

          <tr>

            <td>
              ${escapeHtml(
                x.person.name
              )}
            </td>

            <td>
              ${x.count}回
            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>

  `;

}


/* =========================
   ページを開いたとき
========================= */

window.addEventListener(
  "DOMContentLoaded",
  ()=>{

    /*
      保存データがあれば
      自動的に復元する
    */

    const saved=
      localStorage.getItem(
        STORAGE_KEY
      );


    if(saved){

      try{

        const data=
          JSON.parse(saved);


        /*
          自動復元
        */

        $("names").value=
          data.names||"";


        people=
          Array.isArray(data.people)
            ? data.people
            : [];


        $("teamCount").value=
          data.teamCount||4;


        $("teamNG").value=
          data.teamNG||"";


        $("courtCount").value=
          data.courtCount||2;


        $("matchCount").value=
          data.matchCount||10;


        $("pairNG").value=
          data.pairNG||"";


        $("avoidMMFF").checked=
          data.avoidMMFF!==false;


        teams=
          Array.isArray(data.teams)
            ? data.teams
            : [];


        matches=
          Array.isArray(data.matches)
            ? data.matches
            : [];


        renderPeople();

        renderTeams();

        renderMatches();


        if(matches.length){

          const counts={};


          people.forEach(p=>{
            counts[p.id]=0;
          });


          matches.forEach(m=>{

            [
              ...m.a,
              ...m.b
            ].forEach(p=>{

              if(
                counts[p.id]!==undefined
              ){

                counts[p.id]++;

              }

            });

          });


          renderAppearances(
            counts
          );

        }


        $("saveStatus").textContent=
          "前回のデータを自動復元しました ✓";


      }catch(e){

        console.log(
          "保存データの復元に失敗",
          e
        );

      }

    }

  }
);

</script>
