<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テニスサークル組み合わせメーカー</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  background: #f3f6f8;
  color: #17202a;
}

header {
  background: #173f5f;
  color: white;
  padding: 24px 16px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  opacity: .85;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
  border-left: 5px solid #1f9d8b;
  padding-left: 10px;
}

h3 {
  margin-top: 0;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: bold;
  background: #1f9d8b;
  color: white;
}

button:hover {
  opacity: .85;
}

button.secondary {
  background: #607d8b;
}

button.danger {
  background: #d9534f;
}

button.warning {
  background: #d99b00;
}

button.small {
  padding: 6px 9px;
  font-size: 12px;
}

input,
select {
  width: 100%;
  padding: 9px;
  border: 1px solid #ccd5db;
  border-radius: 7px;
  background: white;
  font-size: 14px;
}

label {
  display: block;
  margin-bottom: 5px;
  font-size: 13px;
  font-weight: bold;
}

.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr;
  gap: 12px;
  align-items: end;
}

.controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.action-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 15px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th,
td {
  padding: 9px;
  border-bottom: 1px solid #e4e8eb;
  text-align: center;
}

th {
  background: #eef3f5;
}

tr.absent {
  opacity: .45;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.badge.grade {
  background: #edf0f2;
}

.ng-section {
  margin-top: 20px;
  padding: 15px;
  background: #f7f9fa;
  border-radius: 10px;
}

.ng-row {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 8px;
  margin-bottom: 8px;
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 15px;
  margin-top: 15px;
}

.team {
  border: 2px solid #dfe7eb;
  border-radius: 12px;
  padding: 14px;
  background: #fafcfd;
}

.team h3 {
  color: #173f5f;
}

.player {
  display: flex;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid #e8edef;
}

.player:last-child {
  border-bottom: 0;
}

.match-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 15px;
  margin-top: 15px;
}

.match {
  border: 2px solid #dfe7eb;
  border-radius: 12px;
  padding: 15px;
  background: white;
}

.match-title {
  font-weight: bold;
  color: #173f5f;
  margin-bottom: 10px;
}

.match-vs {
  text-align: center;
  font-weight: bold;
  margin: 8px;
  color: #888;
}

.pair {
  background: #f2f7f8;
  padding: 9px;
  border-radius: 7px;
}

.notice {
  background: #fff8df;
  border-left: 4px solid #d99b00;
  padding: 12px;
  border-radius: 7px;
  margin-top: 12px;
}

.success {
  background: #e7f7f2;
  border-left: 4px solid #1f9d8b;
  padding: 12px;
  border-radius: 7px;
  margin-top: 12px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 25px;
}

.stat-good {
  font-weight: bold;
}

.stat-bad {
  color: #c0392b;
  font-weight: bold;
}

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 15px;
}

.summary-box {
  background: #f4f7f8;
  border-radius: 10px;
  padding: 12px;
  text-align: center;
}

.summary-number {
  font-size: 25px;
  font-weight: bold;
  color: #173f5f;
}

footer {
  text-align: center;
  color: #777;
  padding: 30px;
  font-size: 13px;
}

@media(max-width:700px) {
  .form-grid,
  .controls {
    grid-template-columns: 1fr 1fr;
  }
}

@media(max-width:500px) {
  .form-grid,
  .controls {
    grid-template-columns: 1fr;
  }

  .ng-row {
    grid-template-columns: 1fr 1fr;
  }

  .ng-row button {
    grid-column: span 2;
  }
}
</style>
</head>

<body>

<header>
  <h1>🎾 テニスサークル組み合わせメーカー</h1>
  <p>出欠・チーム分け・ダブルスを自動作成</p>
</header>

<div class="container">

<!-- =====================================================
     名簿
===================================================== -->

<div class="card">

<h2>① 名簿管理</h2>

<div class="form-grid">

<div>
<label>氏名</label>
<input id="nameInput" placeholder="例：山田太郎">
</div>

<div>
<label>学年</label>
<select id="gradeInput">
<option value="1">1回生</option>
<option value="2">2回生</option>
<option value="3">3回生</option>
<option value="4">4回生以上</option>
</select>
</div>

<div>
<label>性別</label>
<select id="genderInput">
<option value="男">男</option>
<option value="女">女</option>
</select>
</div>

<div>
<label>能力</label>
<select id="skillInput">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5" selected>5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
</select>
</div>

</div>

<div class="action-row">

<button onclick="addPlayer()">
＋ メンバー追加
</button>

<button
  class="secondary"
  onclick="exportData()">
データ保存
</button>

<button
  class="secondary"
  onclick="document.getElementById('fileInput').click()">
データ復元
</button>

<input
  id="fileInput"
  type="file"
  accept=".json"
  style="display:none"
  onchange="importData(event)"
>

</div>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>出席</th>
<th>氏名</th>
<th>学年</th>
<th>性別</th>
<th>能力</th>
<th>操作</th>
</tr>
</thead>

<tbody id="memberTable"></tbody>

</table>

</div>

</div>


<!-- =====================================================
     チーム分け
===================================================== -->

<div class="card">

<h2>② チーム分け</h2>

<div class="controls">

<div>
<label>チーム数</label>
<input
  id="teamCount"
  type="number"
  min="1"
  value="4">
</div>

</div>

<div class="ng-section">

<h3>同じチームにならないペア</h3>

<div id="teamNgList"></div>

<button
  class="secondary small"
  onclick="addTeamNG()">
＋ ペアNGを追加
</button>

</div>

<div class="action-row">

<button onclick="makeTeams()">
🎲 チーム分け実行
</button>

</div>

<div id="teamResult"></div>

</div>


<!-- =====================================================
     ダブルス
===================================================== -->

<div class="card">

<h2>③ ダブルス自動作成</h2>

<div class="controls">

<div>
<label>コート数</label>
<input
  id="courtCount"
  type="number"
  min="1"
  value="2">
</div>

<div>
<label>試合数</label>
<input
  id="matchCount"
  type="number"
  min="1"
  value="10">
</div>

</div>

<div class="ng-section">

<h3>ダブルス・ペアNG</h3>

<p style="font-size:13px;color:#666;">
ここで設定した2人は「同じペア」にはなりません。
対戦相手として組み合わせることは可能です。
</p>

<div id="doubleNgList"></div>

<button
  class="secondary small"
  onclick="addDoubleNG()">
＋ ペアNGを追加
</button>

</div>

<div class="action-row">

<button onclick="makeMatches()">
🎾 ダブルスを作成
</button>

</div>

<div id="matchResult"></div>

</div>


<!-- =====================================================
     出場回数
===================================================== -->

<div class="card">

<h2>④ 出場回数</h2>

<div id="statsResult">

<div class="empty">
まだ試合が作成されていません。
</div>

</div>

</div>

</div>

<footer>
テニスサークル組み合わせメーカー
</footer>


<script>

/* =========================================================
   データ
========================================================= */

let players = [];

let teamNG = [];

let doubleNG = [];

let teams = [];

let matches = [];


/* =========================================================
   初期化
========================================================= */

window.onload = function() {

  loadData();

  renderMembers();

  renderNGLists();

};


/* =========================================================
   保存
========================================================= */

function saveData() {

  localStorage.setItem(
    "tennisCircleData",
    JSON.stringify({
      players,
      teamNG,
      doubleNG
    })
  );

}


/* =========================================================
   読み込み
========================================================= */

function loadData() {

  const raw =
    localStorage.getItem(
      "tennisCircleData"
    );

  if (!raw) return;

  try {

    const data =
      JSON.parse(raw);

    players =
      Array.isArray(data.players)
        ? data.players
        : [];

    teamNG =
      Array.isArray(data.teamNG)
        ? data.teamNG
        : [];

    doubleNG =
      Array.isArray(data.doubleNG)
        ? data.doubleNG
        : [];

  } catch(e) {

    console.error(e);

  }

}


/* =========================================================
   メンバー追加
========================================================= */

function addPlayer() {

  const name =
    document
      .getElementById("nameInput")
      .value
      .trim();

  if (!name) {

    alert("氏名を入力してください。");

    return;

  }

  const player = {

    id:
      createID(),

    name,

    grade:
      Number(
        document
          .getElementById("gradeInput")
          .value
      ),

    gender:
      document
        .getElementById("genderInput")
        .value,

    skill:
      Number(
        document
          .getElementById("skillInput")
          .value
      ),

    present: true

  };

  players.push(player);

  document
    .getElementById("nameInput")
    .value = "";

  saveData();

  renderMembers();

  renderNGLists();

}


/* =========================================================
   メンバー表示
========================================================= */

function renderMembers() {

  const tbody =
    document.getElementById(
      "memberTable"
    );

  if (!players.length) {

    tbody.innerHTML = `
      <tr>
        <td colspan="6" class="empty">
          メンバーが登録されていません。
        </td>
      </tr>
    `;

    return;

  }

  tbody.innerHTML =
    players.map(
      (p,index) => `

      <tr class="${p.present ? "" : "absent"}">

        <td>

          <input
            type="checkbox"
            ${p.present ? "checked" : ""}
            onchange="toggleAttendance(${index})"
          >

        </td>

        <td>

          <input
            value="${escapeHTML(p.name)}"
            onchange="editName(${index},this.value)"
          >

        </td>

        <td>

          <select
            onchange="editGrade(${index},this.value)">

            ${gradeOptions(p.grade)}

          </select>

        </td>

        <td>

          <select
            onchange="editGender(${index},this.value)">

            <option
              value="男"
              ${p.gender === "男" ? "selected" : ""}>
              男
            </option>

            <option
              value="女"
              ${p.gender === "女" ? "selected" : ""}>
              女
            </option>

          </select>

        </td>

        <td>

          <select
            onchange="editSkill(${index},this.value)">

            ${skillOptions(p.skill)}

          </select>

        </td>

        <td>

          <button
            class="danger small"
            onclick="deletePlayer(${index})">
            削除
          </button>

        </td>

      </tr>

    `
    ).join("");

}


/* =========================================================
   編集
========================================================= */

function editName(index,value) {

  players[index].name =
    value.trim();

  saveData();

  renderNGLists();

}


function editGrade(index,value) {

  players[index].grade =
    Number(value);

  saveData();

}


function editGender(index,value) {

  players[index].gender =
    value;

  saveData();

}


function editSkill(index,value) {

  players[index].skill =
    Number(value);

  saveData();

}


function toggleAttendance(index) {

  players[index].present =
    !players[index].present;

  saveData();

  renderMembers();

}


/* =========================================================
   削除
========================================================= */

function deletePlayer(index) {

  const p =
    players[index];

  if (
    !confirm(
      p.name +
      "を削除しますか？"
    )
  ) {
    return;
  }

  const id =
    p.id;

  players.splice(
    index,
    1
  );

  teamNG =
    teamNG.filter(
      pair =>
        pair[0] !== id &&
        pair[1] !== id
    );

  doubleNG =
    doubleNG.filter(
      pair =>
        pair[0] !== id &&
        pair[1] !== id
    );

  saveData();

  renderMembers();

  renderNGLists();

}


/* =========================================================
   チームNG
========================================================= */

function addTeamNG() {

  if (players.length < 2) {

    alert(
      "2人以上登録してください。"
    );

    return;

  }

  teamNG.push([
    players[0].id,
    players[1].id
  ]);

  saveData();

  renderNGLists();

}


function addDoubleNG() {

  if (players.length < 2) {

    alert(
      "2人以上登録してください。"
    );

    return;

  }

  doubleNG.push([
    players[0].id,
    players[1].id
  ]);

  saveData();

  renderNGLists();

}


/* =========================================================
   NG表示
========================================================= */

function renderNGLists() {

  renderNGList(
    "teamNgList",
    teamNG,
    "team"
  );

  renderNGList(
    "doubleNgList",
    doubleNG,
    "double"
  );

}


function renderNGList(
  elementID,
  list,
  type
) {

  const container =
    document.getElementById(
      elementID
    );

  if (!list.length) {

    container.innerHTML =
      `<p style="font-size:13px;color:#888;">
        設定されているNGはありません。
      </p>`;

    return;

  }

  container.innerHTML =
    list.map(
      (pair,index) => `

      <div class="ng-row">

        <select
          onchange="
            changeNG(
              '${type}',
              ${index},
              0,
              this.value
            )
          ">

          ${playerOptions(pair[0])}

        </select>

        <select
          onchange="
            changeNG(
              '${type}',
              ${index},
              1,
              this.value
            )
          ">

          ${playerOptions(pair[1])}

        </select>

        <button
          class="danger small"
          onclick="
            removeNG(
              '${type}',
              ${index}
            )
          ">
          削除
        </button>

      </div>

    `
    ).join("");

}


function changeNG(
  type,
  index,
  position,
  value
) {

  const list =
    type === "team"
      ? teamNG
      : doubleNG;

  list[index][position] =
    value;

  saveData();

}


function removeNG(
  type,
  index
) {

  if (type === "team") {

    teamNG.splice(
      index,
      1
    );

  } else {

    doubleNG.splice(
      index,
      1
    );

  }

  saveData();

  renderNGLists();

}


/* =========================================================
   NG判定
========================================================= */

function isNG(
  list,
  a,
  b
) {

  return list.some(
    pair =>

      (
        pair[0] === a.id &&
        pair[1] === b.id
      )

      ||

      (
        pair[0] === b.id &&
        pair[1] === a.id
      )
  );

}


/* =========================================================
   チーム作成
========================================================= */

function makeTeams() {

  const active =
    players.filter(
      p => p.present
    );

  const teamCount =
    Math.max(
      1,
      Number(
        document
          .getElementById("teamCount")
          .value
      )
    );

  if (!active.length) {

    alert(
      "出席者がいません。"
    );

    return;

  }

  if (
    teamCount >
    active.length
  ) {

    alert(
      "チーム数が出席人数を超えています。"
    );

    return;

  }


  /*
   * 初期配置
   *
   * 能力順に蛇行配置。
   */

  const sorted =
    [...active].sort(
      (a,b) =>
        b.skill - a.skill
    );

  teams =
    Array.from(
      {
        length: teamCount
      },
      () => []
    );


  sorted.forEach(
    (player,index) => {

      const round =
        Math.floor(
          index / teamCount
        );

      let position =
        index % teamCount;

      if (
        round % 2 === 1
      ) {

        position =
          teamCount -
          1 -
          position;

      }

      teams[position].push(
        player
      );

    }
  );


  /*
   * 交換による改善
   */

  for (
    let iteration = 0;
    iteration < 3000;
    iteration++
  ) {

    let current =
      evaluateTeams(
        teams
      );

    let best =
      null;

    let bestScore =
      current;


    for (
      let a = 0;
      a < teams.length;
      a++
    ) {

      for (
        let b = a + 1;
        b < teams.length;
        b++
      ) {

        for (
          let i = 0;
          i < teams[a].length;
          i++
        ) {

          for (
            let j = 0;
            j < teams[b].length;
            j++
          ) {

            [
              teams[a][i],
              teams[b][j]
            ] =
            [
              teams[b][j],
              teams[a][i]
            ];


            const score =
              evaluateTeams(
                teams
              );


            if (
              score <
              bestScore
            ) {

              bestScore =
                score;

              best = {
                a,
                b,
                i,
                j
              };

            }


            [
              teams[a][i],
              teams[b][j]
            ] =
            [
              teams[b][j],
              teams[a][i]
            ];

          }

        }

      }

    }


    if (!best) {
      break;
    }


    [
      teams[best.a][best.i],
      teams[best.b][best.j]
    ] =
    [
      teams[best.b][best.j],
      teams[best.a][best.i]
    ];

  }


  renderTeams();

}


/* =========================================================
   チーム評価
========================================================= */

function evaluateTeams(
  teamList
) {

  let score = 0;


  /*
   * ★最優先
   * 人数差
   */

  const sizes =
    teamList.map(
      team => team.length
    );

  const maxSize =
    Math.max(...sizes);

  const minSize =
    Math.min(...sizes);


  score +=
    (
      maxSize -
      minSize
    ) * 1000000;


  /*
   * 能力
   */

  const averages =
    teamList.map(
      team => {

        if (!team.length) {
          return 0;
        }

        return team.reduce(
          (sum,p) =>
            sum + p.skill,
          0
        ) / team.length;

      }
    );


  const average =
    averages.reduce(
      (a,b) => a+b,
      0
    ) / averages.length;


  averages.forEach(
    value => {

      score +=
        Math.abs(
          value - average
        ) * 1000;

    }
  );


  /*
   * 男女比
   */

  const genderRatios =
    teamList.map(
      team => {

        if (!team.length) {
          return 0;
        }

        const male =
          team.filter(
            p =>
              p.gender === "男"
          ).length;

        return (
          male /
          team.length
        );

      }
    );


  const genderAverage =
    genderRatios.reduce(
      (a,b) => a+b,
      0
    ) /
    genderRatios.length;


  genderRatios.forEach(
    ratio => {

      score +=
        Math.abs(
          ratio -
          genderAverage
        ) * 500;

    }
  );


  /*
   * 学年
   */

  for (
    let grade = 1;
    grade <= 4;
    grade++
  ) {

    const counts =
      teamList.map(
        team =>
          team.filter(
            p =>
              p.grade === grade
          ).length
      );

    const avg =
      counts.reduce(
        (a,b) => a+b,
        0
      ) /
      counts.length;

    counts.forEach(
      count => {

        score +=
          Math.abs(
            count - avg
          ) * 200;

      }
    );

  }


  /*
   * チーム内NG
   */

  teamList.forEach(
    team => {

      for (
        let i = 0;
        i < team.length;
        i++
      ) {

        for (
          let j = i + 1;
          j < team.length;
          j++
        ) {

          if (
            isNG(
              teamNG,
              team[i],
              team[j]
            )
          ) {

            score +=
              100000000;

          }

        }

      }

    }
  );


  return score;

}

/* =========================================================
   ★ ダブルス作成
========================================================= */

function makeMatches() {

  const active =
    players.filter(
      p => p.present
    );

  const courtCount =
    Math.max(
      1,
      Number(
        document
          .getElementById("courtCount")
          .value
      )
    );

  const matchCount =
    Math.max(
      1,
      Number(
        document
          .getElementById("matchCount")
          .value
      )
    );


  if (
    active.length < 4
  ) {

    alert(
      "ダブルスには4人以上の出席者が必要です。"
    );

    return;

  }


  /*
   * 1ラウンドで使える最大人数
   */

  const matchesPerRound =
    Math.min(
      courtCount,
      Math.floor(
        active.length / 4
      )
    );


  if (
    matchesPerRound < 1
  ) {

    alert(
      "試合を作成できません。"
    );

    return;

  }


  /*
   * 出場回数
   */

  const appearance = {};

  active.forEach(
    p => {
      appearance[p.id] = 0;
    }
  );


  /*
   * 連続出場数
   */

  const consecutive = {};

  active.forEach(
    p => {
      consecutive[p.id] = 0;
    }
  );


  /*
   * ペア履歴
   */

  const pairHistory = {};

  /*
   * 対戦履歴
   */

  const opponentHistory = {};


  active.forEach(
    p => {

      pairHistory[p.id] = {};

      opponentHistory[p.id] = {};

    }
  );


  matches = [];


  /*
   * =====================================================
   * 各ラウンド
   * =====================================================
   */

  for (
    let round = 0;
    round < matchCount;
    round++
  ) {

    const used =
      new Set();

    const roundMatches = [];


    /*
     * コートごとに作る
     */

    for (
      let court = 0;
      court < matchesPerRound;
      court++
    ) {

      /*
       * 現時点で出場回数が少ない人を
       * 優先して候補にする。
       */

      const candidates =
        generateMatchCandidates(
          active,
          used,
          appearance,
          consecutive,
          pairHistory,
          opponentHistory
        );


      if (
        !candidates.length
      ) {
        break;
      }


      /*
       * 最良候補を探す
       */

      let best = null;

      let bestScore =
        Infinity;


      /*
       * 候補数が多い場合でも
       * 全探索しすぎない。
       */

      const shuffled =
        shuffle(
          candidates
        );


      const limit =
        Math.min(
          shuffled.length,
          5000
        );


      for (
        let i = 0;
        i < limit;
        i++
      ) {

        const candidate =
          shuffled[i];


        const score =
          evaluateDoubleMatch(
            candidate,
            active,
            used,
            appearance,
            consecutive,
            pairHistory,
            opponentHistory,
            round
          );


        if (
          score <
          bestScore
        ) {

          bestScore =
            score;

          best =
            candidate;

        }

      }


      if (!best) {
        break;
      }


      /*
       * 採用
       */

      roundMatches.push(
        best
      );


      best.players.forEach(
        p => {

          used.add(
            p.id
          );

          appearance[p.id]++;

        }
      );


      registerHistory(
        best,
        pairHistory,
        opponentHistory
      );

    }


    /*
     * 連続出場を更新
     */

    active.forEach(
      p => {

        if (
          used.has(p.id)
        ) {

          consecutive[p.id]++;

        } else {

          consecutive[p.id] = 0;

        }

      }
    );


    matches.push(
      ...roundMatches
    );

  }


  renderMatches(
    matches,
    appearance
  );

}


/* =========================================================
   ★ 候補生成
========================================================= */

function generateMatchCandidates(
  active,
  used,
  appearance,
  consecutive,
  pairHistory,
  opponentHistory
) {

  /*
   * 現在出場回数が少ない順
   */

  const available =
    active
      .filter(
        p =>
          !used.has(p.id)
      )
      .sort(
        (a,b) => {

          /*
           * 出場回数を最優先
           */

          if (
            appearance[a.id] !==
            appearance[b.id]
          ) {

            return (
              appearance[a.id] -
              appearance[b.id]
            );

          }


          /*
           * 次に連続出場
           */

          return (
            consecutive[a.id] -
            consecutive[b.id]
          );

        }
      );


  /*
   * 男女別
   */

  const males =
    available.filter(
      p => p.gender === "男"
    );

  const females =
    available.filter(
      p => p.gender === "女"
    );


  const candidates = [];


  /*
   * =====================================================
   * 男男 vs 男男
   * =====================================================
   */

  const mmPairs =
    generateValidPairs(
      males
    );


  for (
    let i = 0;
    i < mmPairs.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < mmPairs.length;
      j++
    ) {

      const pair1 =
        mmPairs[i];

      const pair2 =
        mmPairs[j];


      if (
        overlap(
          pair1,
          pair2
        )
      ) {
        continue;
      }


      candidates.push(
        createMatch(
          pair1,
          pair2,
          "男男 vs 男男"
        )
      );

    }

  }


  /*
   * =====================================================
   * 女女 vs 女女
   * =====================================================
   */

  const ffPairs =
    generateValidPairs(
      females
    );


  for (
    let i = 0;
    i < ffPairs.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < ffPairs.length;
      j++
    ) {

      const pair1 =
        ffPairs[i];

      const pair2 =
        ffPairs[j];


      if (
        overlap(
          pair1,
          pair2
        )
      ) {
        continue;
      }


      candidates.push(
        createMatch(
          pair1,
          pair2,
          "女女 vs 女女"
        )
      );

    }

  }


  /*
   * =====================================================
   * 男女 vs 男女
   * =====================================================
   */

  for (
    const m1 of males
  ) {

    for (
      const m2 of males
    ) {

      if (
        m1.id === m2.id
      ) {
        continue;
      }


      for (
        const f1 of females
      ) {

        for (
          const f2 of females
        ) {

          if (
            f1.id === f2.id
          ) {
            continue;
          }


          /*
           * 男女ペア①
           */

          if (
            !isNG(
              doubleNG,
              m1,
              f1
            ) &&
            !isNG(
              doubleNG,
              m2,
              f2
            )
          ) {

            candidates.push(
              createMatch(
                [m1,f1],
                [m2,f2],
                "男女 vs 男女"
              )
            );

          }


          /*
           * 男女ペア②
           */

          if (
            !isNG(
              doubleNG,
              m1,
              f2
            ) &&
            !isNG(
              doubleNG,
              m2,
              f1
            )
          ) {

            candidates.push(
              createMatch(
                [m1,f2],
                [m2,f1],
                "男女 vs 男女"
              )
            );

          }

        }

      }

    }

  }


  /*
   * 同一人物が4人の中に
   * 重複している候補を除外
   */

  return candidates.filter(
    match => {

      const ids =
        match.players.map(
          p => p.id
        );

      return (
        new Set(ids).size === 4
      );

    }
  );

}


/* =========================================================
   有効なペア
========================================================= */

function generateValidPairs(
  playersList
) {

  const pairs = [];


  for (
    let i = 0;
    i < playersList.length;
    i++
  ) {

    for (
      let j = i + 1;
      j < playersList.length;
      j++
    ) {

      const a =
        playersList[i];

      const b =
        playersList[j];


      if (
        isNG(
          doubleNG,
          a,
          b
        )
      ) {
        continue;
      }


      pairs.push([
        a,
        b
      ]);

    }

  }


  return pairs;

}


/* =========================================================
   試合生成
========================================================= */

function createMatch(
  pair1,
  pair2,
  type
) {

  return {

    pair1,

    pair2,

    players: [
      ...pair1,
      ...pair2
    ],

    type

  };

}


/* =========================================================
   ★ ダブルス評価
========================================================= */

function evaluateDoubleMatch(
  match,
  active,
  used,
  appearance,
  consecutive,
  pairHistory,
  opponentHistory,
  round
) {

  let score = 0;


  /*
   * =====================================================
   * 最重要
   *
   * 「この試合を入れた後の
   *  出場回数の最大値−最小値」
   *
   * これを最優先する。
   * =====================================================
   */

  const after =
    { ...appearance };


  match.players.forEach(
    p => {

      after[p.id]++;

    }
  );


  const counts =
    active.map(
      p => after[p.id]
    );


  const maxCount =
    Math.max(...counts);

  const minCount =
    Math.min(...counts);


  /*
   * ★圧倒的に大きな重み
   */

  score +=
    (
      maxCount -
      minCount
    ) * 100000000;


  /*
   * =====================================================
   * 次に「多い人を休ませる」
   * =====================================================
   */

  match.players.forEach(
    p => {

      score +=
        appearance[p.id] *
        1000000;

    }
  );


  /*
   * =====================================================
   * 「少ない人を優先」
   *
   * 4人の現在試合数合計が少ないほど良い。
   * =====================================================
   */

  const totalAppearance =
    match.players.reduce(
      (sum,p) =>
        sum + appearance[p.id],
      0
    );


  score +=
    totalAppearance *
    100000;


  /*
   * =====================================================
   * 連続出場
   * =====================================================
   */

  match.players.forEach(
    p => {

      score +=
        consecutive[p.id] *
        10000;

    }
  );


  /*
   * =====================================================
   * 能力差
   *
   * ここから優先順位が大幅に下がる。
   * =====================================================
   */

  const skill1 =
    match.pair1.reduce(
      (sum,p) =>
        sum + p.skill,
      0
    );

  const skill2 =
    match.pair2.reduce(
      (sum,p) =>
        sum + p.skill,
      0
    );


  score +=
    Math.abs(
      skill1 -
      skill2
    ) * 1000;


  /*
   * =====================================================
   * 同じペア
   * =====================================================
   */

  const a =
    match.pair1[0].id;

  const b =
    match.pair1[1].id;

  const c =
    match.pair2[0].id;

  const d =
    match.pair2[1].id;


  const pairAB =
    pairHistory[a]?.[b] || 0;

  const pairCD =
    pairHistory[c]?.[d] || 0;


  score +=
    (
      pairAB +
      pairCD
    ) * 500;


  /*
   * =====================================================
   * 同じ対戦
   * =====================================================
   */

  const opponents =
    (
      opponentHistory[a]?.[c] || 0
    )
    +
    (
      opponentHistory[a]?.[d] || 0
    )
    +
    (
      opponentHistory[b]?.[c] || 0
    )
    +
    (
      opponentHistory[b]?.[d] || 0
    );


  score +=
    opponents * 100;


  return score;

}


/* =========================================================
   履歴登録
========================================================= */

function registerHistory(
  match,
  pairHistory,
  opponentHistory
) {

  const a =
    match.pair1[0];

  const b =
    match.pair1[1];

  const c =
    match.pair2[0];

  const d =
    match.pair2[1];


  addHistory(
    pairHistory,
    a.id,
    b.id
  );

  addHistory(
    pairHistory,
    c.id,
    d.id
  );


  addHistory(
    opponentHistory,
    a.id,
    c.id
  );

  addHistory(
    opponentHistory,
    a.id,
    d.id
  );

  addHistory(
    opponentHistory,
    b.id,
    c.id
  );

  addHistory(
    opponentHistory,
    b.id,
    d.id
  );

}


function addHistory(
  history,
  a,
  b
) {

  if (!history[a]) {
    history[a] = {};
  }

  if (!history[b]) {
    history[b] = {};
  }


  history[a][b] =
    (history[a][b] || 0) + 1;

  history[b][a] =
    (history[b][a] || 0) + 1;

}


/* =========================================================
   重複判定
========================================================= */

function overlap(
  pair1,
  pair2
) {

  const ids =
    pair1.map(
      p => p.id
    );

  return pair2.some(
    p =>
      ids.includes(p.id)
  );

}

/* =========================================================
   データ保存
========================================================= */

function exportData() {

  const data = {

    version: 2,

    players,

    teamNG,

    doubleNG,

    savedAt:
      new Date().toISOString()

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      "a"
    );


  a.href = url;

  a.download =
    "tennis-circle-data.json";

  a.click();


  URL.revokeObjectURL(
    url
  );

}


/* =========================================================
   データ復元
========================================================= */

function importData(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const data =
          JSON.parse(
            e.target.result
          );


        if (
          !Array.isArray(
            data.players
          )
        ) {

          throw new Error();

        }


        players =
          data.players || [];

        teamNG =
          data.teamNG || [];

        doubleNG =
          data.doubleNG || [];


        saveData();

        renderMembers();

        renderNGLists();


        alert(
          "データを復元しました。"
        );


      } catch(error) {

        alert(
          "データの読み込みに失敗しました。"
        );

      }

    };


  reader.readAsText(
    file
  );

}

            ? "selected"
            : ""
        }
      >

        ${escapeHTML(p.name)}

      </option>

    `
  ).join("");

}


function gradeOptions(
  selected
) {

  return `

    <option
      value="1"
      ${selected === 1 ? "selected" : ""}>
      1回生
    </option>

    <option
      value="2"
      ${selected === 2 ? "selected" : ""}>
      2回生
    </option>

    <option
      value="3"
      ${selected === 3 ? "selected" : ""}>
      3回生
    </option>

    <option
      value="4"
      ${selected === 4 ? "selected" : ""}>
      4回生以上
    </option>

  `;

}


function skillOptions(
  selected
) {

  return Array
    .from(
      {
        length: 10
      },
      (_,i) => i + 1
    )
    .map(
      value => `

        <option
          value="${value}"
          ${
            selected === value
              ? "selected"
              : ""
          }
        >
          ${value}
        </option>

      `
    )
    .join("");

}


function gradeText(
  grade
) {

  if (grade === 1)
    return "1回生";

  if (grade === 2)
    return "2回生";

  if (grade === 3)
    return "3回生";

  return "4回生以上";

}


/* =========================================================
   ランダム
========================================================= */

function shuffle(array) {

  const result =
    [...array];


  for (
    let i =
      result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      result[i],
      result[j]
    ] =
    [
      result[j],
      result[i]
    ];

  }


  return result;

}


/* =========================================================
   ID
========================================================= */

function createID() {

  return (
    Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .substring(2)
  );

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHTML(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
