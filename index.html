<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ダブルスマッチ＆出欠管理</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#f5f7fa;color:#222}
main{max-width:820px;margin:auto;padding:20px 14px 44px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:19px;margin:0 0 14px}h3{margin:0}
p{line-height:1.6}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
input,textarea,select{width:100%;font-size:16px;padding:10px;border:1px solid #bbb;border-radius:9px;background:#fff}
button{border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}.primary{background:#1769e0;color:#fff}.secondary{background:#e9edf3;color:#222}.danger{background:#f1dada;color:#8a2222}
.small{font-size:13px;color:#666}.notice{padding:11px;border-radius:9px;background:#fff3cd;margin-top:10px}.error{padding:11px;border-radius:9px;background:#fde2e2;color:#8a2222;margin-top:10px}
.att-table{margin-top:10px}.att-row{display:grid;grid-template-columns:42px minmax(100px,1fr) 90px 120px;gap:8px;align-items:center;border:1px solid #e1e4e8;border-radius:10px;padding:8px;margin:6px 0;background:#fafafa}.att-row .check{width:22px;height:22px;margin:auto}.att-row input,.att-row select{margin:0}.att-head{display:grid;grid-template-columns:42px minmax(100px,1fr) 90px 120px;gap:8px;padding:0 8px;color:#666;font-size:12px;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.stat{background:#f1f4f8;border-radius:9px;padding:9px 12px}.count-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:7px;margin-top:10px}.count-item{display:flex;justify-content:space-between;gap:8px;border:1px solid #ddd;border-radius:9px;padding:9px;background:#fafafa}
.round{border:1px solid #d9dde3;border-radius:14px;overflow:hidden;margin:14px 0;background:#fff}.round-title{font-weight:800;padding:12px 14px;background:#f1f4f8;font-size:17px}.court{padding:13px;border-top:1px solid #eee}.court-name{font-size:13px;color:#666;margin-bottom:8px}.match-card{border:1px solid #dfe3e8;border-radius:12px;padding:12px;background:#fbfcfd}.teams{display:grid;grid-template-columns:1fr 52px 1fr;gap:9px;align-items:center}.team{border:1px solid #d8dde5;border-radius:10px;padding:10px;background:#fff}.player{font-weight:800;font-size:16px;padding:3px 0}.meta{font-size:12px;color:#666}.vs{text-align:center;font-weight:900;color:#555}.type-tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px;background:#eef2f7;margin-bottom:8px}.round-summary{font-size:12px;color:#666;margin-top:8px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.att-row,.att-head{grid-template-columns:34px minmax(90px,1fr) 72px 92px}.teams{grid-template-columns:1fr 34px 1fr}.player{font-size:14px}}
</style>
</head>
<body>
<main>
<h1>🎾 ダブルス マッチ＆出欠管理</h1>
<p class="small">出場回数の均等を最優先にし、男女の対戦条件・学年バランス・連続出場を考慮して組み合わせます。</p>

<section class="card">
<h2>① 参加者</h2>
<label for="names">名前（1人1行）</label>
<textarea id="names" rows="8" placeholder="田中&#10;山田&#10;佐藤&#10;鈴木&#10;高橋&#10;伊藤&#10;渡辺&#10;中村"></textarea>
<button type="button" class="secondary" id="makeAttendance">出欠欄を作る</button>
<div id="attendance"></div>
</section>

<section class="card">
<h2>② 試合条件</h2>
<div class="grid">
<div><label for="courts">コート数</label><input id="courts" type="number" min="1" max="20" value="2"></div>
<div><label for="rounds">試合数</label><input id="rounds" type="number" min="1" max="50" value="5"></div>
</div>
<p class="small">1ラウンドにつき、1コート4人です。</p>
</section>

<section class="card">
<h2>③ ペアNG</h2>
<label for="ng">同じペアにしたくない組み合わせ</label>
<textarea id="ng" rows="4" placeholder="田中, 山田&#10;佐藤, 鈴木"></textarea>
<p class="small">ペアになるのだけNGです。対戦相手として当たるのはOKです。</p>
</section>

<button type="button" class="primary" id="generate">🎾 出席者でマッチを自動生成</button>
<button type="button" class="secondary" id="checkAll">全員出席</button>
<button type="button" class="secondary" id="uncheckAll">全員欠席</button>
<button type="button" class="danger" id="clear">リセット</button>

<div id="message"></div>
<div id="result"></div>
</main>
<script>
(function(){
const $=id=>document.getElementById(id);let people=[];
const gradeLabel=g=>g==='4'?'4回生以上':g+'回生';
function parseNames(){return $("names").value.split(/\n/).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i)}
function pairKey(a,b){return a<b?a+"\0"+b:b+"\0"+a}
function shuffle(a){let x=a.slice();for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function makeAttendance(){
 people=parseNames();const box=$("attendance");box.innerHTML="";
 if(!people.length){box.innerHTML='<div class="error">名前を入力してください。</div>';return}
 const wrap=document.createElement("div");wrap.className="att-table";
 wrap.innerHTML='<div class="att-head"><span>出欠</span><span>名前</span><span>性別</span><span>学年</span></div>';
 people.forEach((n,i)=>{
   const row=document.createElement("div");row.className="att-row";
   row.innerHTML='<input class="check att" type="checkbox" data-name="'+esc(n)+'" checked><input class="pname" value="'+esc(n)+'"><select class="gender"><option value="M">男</option><option value="F">女</option></select><select class="grade"><option value="1">1回生</option><option value="2">2回生</option><option value="3">3回生</option><option value="4">4回生以上</option></select>';
   wrap.appendChild(row);
 });box.appendChild(wrap);box.insertAdjacentHTML("beforeend",'<p class="small">出席・性別・学年を入力してください。マッチ生成では出席者だけを使用します。</p>');
}
function getData(){return [...document.querySelectorAll('.att-row')].map(row=>({name:row.querySelector('.pname').value.trim(),present:row.querySelector('.att').checked,gender:row.querySelector('.gender').value,grade:row.querySelector('.grade').value})).filter(x=>x.name)}
function parseNG(names){const set=new Set(),bad=[];$("ng").value.split(/\n/).map(x=>x.trim()).filter(Boolean).forEach(line=>{const p=line.split(/[、,，]/).map(x=>x.trim()).filter(Boolean);if(p.length!==2||p[0]===p[1]||!names.includes(p[0])||!names.includes(p[1]))bad.push(line);else set.add(pairKey(p[0],p[1]))});return{set,bad}}
function pairOK(a,b,ng){return !ng.has(pairKey(a.name,b.name))}
function legalFour(t){const m=t.filter(x=>x.gender==='M').length;return m===0||m===2||m===4}
function typeOf(t){const m=t.filter(x=>x.gender==='M').length;return m===2?'男女 vs 男女':m===4?'男男 vs 男男':'女女 vs 女女'}
function validPairing(t,ng){return pairOK(t[0],t[1],ng)&&pairOK(t[2],t[3],ng)}
function gradeSpread(team){const gs=team.map(x=>+x.grade).sort((a,b)=>a-b);return gs[gs.length-1]-gs[0]}
function gradeBalanceScore(a,b){return Math.abs(a.reduce((s,x)=>s+(+x.grade),0)-b.reduce((s,x)=>s+(+x.grade),0))*20+gradeSpread(a)*4+gradeSpread(b)*4}
function buildPairing(four,ng,pairCounts,oppCounts){
 let best=null,bestScore=Infinity;
 for(let z=0;z<100;z++){
   const t=shuffle(four), candidates=[[[t[0],t[1]],[t[2],t[3]]],[[t[0],t[2]],[t[1],t[3]]],[[t[0],t[3]],[t[1],t[2]]]];
   for(const [a,b] of candidates){
     if(!pairOK(a[0],a[1],ng)||!pairOK(b[0],b[1],ng))continue;
     let s=gradeBalanceScore(a,b);
     s+=(pairCounts.get(pairKey(a[0].name,a[1].name))||0)*500;
     s+=(pairCounts.get(pairKey(b[0].name,b[1].name))||0)*500;
     for(const x of a)for(const y of b)s+=(oppCounts.get(pairKey(x.name,y.name))||0)*15;
